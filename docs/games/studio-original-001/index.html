<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Peach Bounce</title><link rel="stylesheet" href="./game.css?build=42105188493-1"></head>
<body><main>
<header><div class="eyebrow">A LITTLE JAM SESSION</div><h1>Peach Bounce<span aria-hidden="true"> 🍑</span></h1><p>Drag the tray to bounce the peach into all 15 jam tiles.</p></header>
