name: Cataclysm 1.0 Cats Alive · preserve work and recover Night99 lab
run-name: Restore complete Cats Alive candidate → independent browser QA → live release
on:
  push:
    branches: [main]
    paths:
      - game_factory/requests/cataclysm_10_finish_ALIVE_RECOVER.md
permissions:
  contents: read
  actions: read
concurrency:
  group: borhez-cataclysm-alive-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore EXACT completed studio source from the failed Night99 QA, retaining every generated image and dialogue line
        uses: actions/download-artifact@v4
        with:
          repository: BoRHeX/kbc-rpg-prototype
          run-id: 43443458400
          github-token: ${{ github.token }}
          name: cataclysm-10-unaccepted-alive-source
          path: docs/
      - name: Repair ONLY laboratory Night99 start flag, preserving complete candidate
        run: |
          set -euo pipefail
          python game_factory/cataclysm_next/qa/recover_alive_lab.py
          for file in docs/cataclysm-1-0-major/*.js docs/cataclysm-100-lab/*.js; do node --check "$file"; done
          test -s docs/cataclysm-1-0-major/cat-personality.js
          test -s docs/cataclysm-100-lab/cat-personality.js
          node game_factory/cataclysm_next/tests/major-systems.cjs
          node game_factory/cataclysm_next/tests/spawn-economy.cjs
          node game_factory/cataclysm_next/tests/art-integration.cjs
          node game_factory/cataclysm_next/tests/visuals-scroll.cjs
          node game_factory/cataclysm_finish_score_contract.cjs
          node game_factory/cataclysm_finish_acceptance.cjs alive
      - name: Test 8 viewport gameplay, Night99 lab, buffed movement, real turret skins, character dialogue and upgrade UI in independent Chrome
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          nohup python -m http.server 8765 --directory docs >/tmp/cats-alive-recovery-http.log 2>&1 &
          node game_factory/cataclysm_next/tests/browser-major.cjs
          node game_factory/cataclysm_next/tests/browser-infinite.cjs
          node game_factory/cataclysm_next/tests/browser-art.cjs
          node game_factory/cataclysm_next/tests/browser-personality.cjs
          node game_factory/cataclysm_next/tests/browser-tuning.cjs
          node game_factory/cataclysm_next/tests/browser-hero-directional.cjs
          node game_factory/cataclysm_next/tests/browser-alive.cjs
          node game_factory/cataclysm_next/tests/browser-turret-skins.cjs
          node game_factory/cataclysm_next/tests/browser-one-boss.cjs
          node game_factory/cataclysm_next/tests/browser-polish.cjs
      - name: Preserve EXACT accepted game source and all original and newly authored assets
        uses: actions/upload-artifact@v4
        with:
          name: cataclysm-10-finish-alive
          path: |
            docs/cataclysm-1-0-major/
            docs/cataclysm-100-lab/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve browser screenshots and unaccepted candidate for diagnosis if checks fail again
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cataclysm-10-alive-recovery-evidence
          path: |
            artifacts/cataclysm-major/
            artifacts/cataclysm-alive/
            artifacts/cataclysm-hero-directional/
          if-no-files-found: ignore
          retention-days: 30

  release:
    needs: recover
    if: ${{ always() && needs.recover.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.retry.outputs.page_url }}
    concurrency:
      group: borhez-mobile-pages-delivery
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      pages: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore ONLY fully tested Cataclysm 1.0 Cats Alive candidate
        uses: actions/download-artifact@v4
        with:
          name: cataclysm-10-finish-alive
          path: docs/
      - name: Verify full two-mode source, scoring, behavior and all texture contracts
        run: |
          set -euo pipefail
          for game in docs/cataclysm-1-0-major docs/cataclysm-100-lab; do
            for file in "$game"/*.js; do node --check "$file"; done
          done
          node game_factory/cataclysm_next/tests/major-systems.cjs
          node game_factory/cataclysm_next/tests/spawn-economy.cjs
          node game_factory/cataclysm_next/tests/art-integration.cjs
          node game_factory/cataclysm_next/tests/visuals-scroll.cjs
          node game_factory/cataclysm_finish_score_contract.cjs
          node game_factory/cataclysm_finish_acceptance.cjs alive
          git diff --check
      - name: Install Chrome and run comprehensive final mobile regression
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          nohup python -m http.server 8765 --directory docs >/tmp/cata-finish-release.log 2>&1 &
          node game_factory/cataclysm_next/tests/browser-major.cjs
          node game_factory/cataclysm_next/tests/browser-infinite.cjs
          node game_factory/cataclysm_next/tests/browser-art.cjs
          node game_factory/cataclysm_next/tests/browser-personality.cjs
          node game_factory/cataclysm_next/tests/browser-tuning.cjs
          node game_factory/cataclysm_next/tests/browser-hero-directional.cjs
          node game_factory/cataclysm_next/tests/browser-alive.cjs
          node game_factory/cataclysm_next/tests/browser-turret-skins.cjs
          node game_factory/cataclysm_next/tests/browser-one-boss.cjs
          node game_factory/cataclysm_next/tests/browser-polish.cjs
      - name: Commit only independently accepted Cataclysm 1.0 and open PR
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'BoRHeZ Cataclysm 1.0 Studio'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          branch="studio/cataclysm-10-finish-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add docs/cataclysm-1-0-major docs/cataclysm-100-lab
          git diff --cached --check
          if git diff --cached --quiet; then echo "::error::No actual new 1.0 playable code"; exit 1; fi
          python - <<'PY'
          import subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert names
          assert all(x.startswith(('docs/cataclysm-1-0-major/','docs/cataclysm-100-lab/')) for x in names)
          print('Accepted source changes:',len(names))
          PY
          git commit -m "Bring Cataclysm 1.0 cats to life with expressive buff animation, turret skins and original dialogue"
          gh auth setup-git
          git push --set-upstream origin "$branch"
          pr_url="$(gh pr create --base main --head "$branch" --title "Cataclysm 1.0 · Cats Alive creative polish" --body "Creative Cataclysm 1.0 studio pass: more expressive and properly animated hero buff movement with eight-way aiming, original turret cosmetic skins and contextual cat banter. Preserve all existing 1.0 gameplay, score, XP, existing sprite work, controls and cards. Real Chrome QA; no Night100 stress.")"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "$pr_url" >> "$GITHUB_STEP_SUMMARY"
      - name: Merge fully tested game without bypassing branch protection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_URL" --squash --delete-branch
          git checkout main
          git fetch origin main
          git reset --hard origin/main
          node game_factory/cataclysm_finish_score_contract.cjs
          node game_factory/cataclysm_finish_acceptance.cjs alive
      - uses: actions/upload-pages-artifact@v3
        with:
          name: cataclysm-10-complete-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/
      - name: Deploy both accepted 1.0 versions
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: cataclysm-10-complete-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 180000
      - name: Backoff when another Pages deployment overlaps
        if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - name: Retry exact same accepted Pages archive
        id: retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: cataclysm-10-complete-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 180000
      - name: Independently compare real LIVE score and game assets with accepted source
        env:
          PAGES_URL: ${{ steps.deploy.outputs.page_url || steps.retry.outputs.page_url }}
        run: |
          python - <<'PY'
          import hashlib,os,time,urllib.request
          from pathlib import Path
          base=os.environ['PAGES_URL'].rstrip('/')+'/'
          for game in ('cataclysm-1-0-major','cataclysm-100-lab'):
            for name in ('index.html','game.js','score.js','follower-behavior.js','animation.js',
                         'art/tank-run.png','art/characters/sniper/special.png'):
              filename=Path('docs')/game/name
              wanted=hashlib.sha256(filename.read_bytes()).hexdigest()
              for attempt in range(16):
                try:
                  url=base+game+'/'+name+'?verify='+os.environ['GITHUB_RUN_ID']+'&attempt='+str(attempt)
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=20) as reply:
                    observed=hashlib.sha256(reply.read()).hexdigest()
                  if observed!=wanted:raise RuntimeError('Source/live SHA mismatch')
                  print('LIVE:',game,name)
                  break
                except Exception as error:
                  if attempt==15:raise RuntimeError('Live release mismatch '+game+'/'+name+': '+str(error))
                  time.sleep(5)
          PY
      - name: Publish final test links and actual evidence
        run: |
          echo "### Cataclysm 1.0 · Cats Alive creative polish deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Campaign: https://borhex.github.io/kbc-rpg-prototype/cataclysm-1-0-major/" >> "$GITHUB_STEP_SUMMARY"
          echo "Night 99 lab: https://borhex.github.io/kbc-rpg-prototype/cataclysm-100-lab/" >> "$GITHUB_STEP_SUMMARY"
