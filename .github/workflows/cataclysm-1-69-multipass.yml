  publish-candidate:
    name: Release Engineer · always-attempt experimental candidate
    needs: [concept, art, animation, integration, qa, repair06, repair07, repair08]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: write
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve latest REAL archived stage, even after failed QA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/cataclysm-1-69
          retrieved=no
          for p in 08 07 06 05 04 03 02 01; do
            if gh run download "$GITHUB_RUN_ID" -n "cataclysm-169-pass$p-$GITHUB_RUN_ID" -D docs/cataclysm-1-69 2>/dev/null; then
              echo "Recovered pass $p source." >> "$GITHUB_STEP_SUMMARY"
              retrieved=yes
              break
            fi
          done
          if [ "$retrieved" = no ] || [ ! -s docs/cataclysm-1-69/game.js ]; then
            echo "::warning::No surviving pass artifact; preserve a BROKEN baseline-derived candidate."
            rm -rf docs/cataclysm-1-69
            cp -a docs/cataclysm-1-6 docs/cataclysm-1-69
            mkdir -p docs/cataclysm-1-69/STUDIO
          fi
      - name: Mark candidate status honestly and create labeled inspection URL
        run: python game_factory/studio_multipass_169.py candidate
      - name: Archive finalized candidate before publication attempt
        uses: actions/upload-artifact@v4
        with:
          name: cataclysm-169-final-candidate-${{ github.run_id }}
          path: |
            docs/cataclysm-1-69
            docs/cataclysm-1-69-candidate
          if-no-files-found: error
          retention-days: 45
          include-hidden-files: true
      - name: Merge new candidate without changing historical Cataclysm versions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BoRHeZ Games Studio"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="studio/cataclysm-169-candidate-$GITHUB_RUN_ID"
          gh auth setup-git
          git fetch origin main
          git switch -c "$branch" origin/main
          git add docs/cataclysm-1-69 docs/cataclysm-1-69-candidate
          git -c core.whitespace=-trailing-space diff --cached --check
          git diff --cached --quiet && { echo "::error::No candidate files"; exit 1; }
          git commit -m "BoRHeZ multipass: Cataclysm 1.69 experimental candidate with truthful QA"
          gh auth setup-git
          git push --set-upstream origin HEAD
          pr="$(gh pr create --base main --head "$branch" --title "Cataclysm 1.69 · THE WILD CARD — experimental candidate" --body "Creator-authorized 1.69 THE WILD CARD: one Midnight Festival district event, unique illustrated Archivist cat, passive fusion synergy and adaptive sound, preserving all 1.6 mutations and prior systems; genuine five-pass AI production, QA and bounded repairs. Candidate is deliberately kept even if broken; QA status in docs/cataclysm-1-69/STUDIO/CANDIDATE_STATUS.json. Previous 1.6 and earlier versions untouched.")"
          echo "Candidate PR: $pr" >> "$GITHUB_STEP_SUMMARY"
          gh pr merge "$pr" --squash --delete-branch
          git checkout main
          git fetch origin main
          git reset --hard origin/main
          test -s docs/cataclysm-1-69-candidate/index.html
      - name: Package all historical releases and new candidate
        uses: actions/upload-pages-artifact@v3
        with:
          name: cataclysm-169-pages-${{ github.run_id }}
          path: docs
      - name: Publish experimental Cataclysm 1.69 without promoting stable default
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: cataclysm-169-pages-${{ github.run_id }}
          timeout: 180000
      - name: Report real candidate and last stable game locations
        run: |
          echo "### Cataclysm 1.69 — THE WILD CARD (experimental)" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate: https://borhex.github.io/kbc-rpg-prototype/cataclysm-1-69-candidate/" >> "$GITHUB_STEP_SUMMARY"
          echo "Actual game: https://borhex.github.io/kbc-rpg-prototype/cataclysm-1-69/" >> "$GITHUB_STEP_SUMMARY"
          echo "Prior published candidate: https://borhex.github.io/kbc-rpg-prototype/cataclysm-1-6/" >> "$GITHUB_STEP_SUMMARY"
          echo "This is an experimental candidate. The previous 1.6 remains available; status is in candidate JSON." >> "$GITHUB_STEP_SUMMARY"
