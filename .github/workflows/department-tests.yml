name: KBC Department Council tests
on:
  push:
    branches: [feature/kbc-departments-v0]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python departments_lab.py > council-report.json
      - run: python -c "import json; x=json.load(open('council-report.json')); assert x['history_valid']; print(x['decision'])"
