name: BoRHeZ Art & Animation Department
run-name: Art Department · reference → animation → in-game QA → publication
on:
  push:
    branches: [main]
    paths:
      - game_factory/art_department/jobs/active.json
  workflow_dispatch:

# No schedule and no per-asset approval. The entire job is atomic and fail-closed.
concurrency:
  group: borhez-reusable-art-department
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  produce-and-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: write
      pull-requests: write
      actions: read
    outputs:
      pr: ${{ steps.candidate.outputs.pr }}
      review_outcome: ${{ steps.gate1.outcome == 'failure' && 'failure' || steps.review1.outcome }}
    env:
      ART_JOB: game_factory/art_department/jobs/active.json
      BORHEZ_BROWSER_CHANNEL: chrome
    steps:
      - name: Checkout current games studio
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install visual production and real-browser QA tools
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow cairosvg
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          google-chrome --version
      - name: Visual scout — actually inspect the supplied image
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY"
          python -m game_factory.art_department.pipeline prepare
      - name: Character artist + animator + in-game integration engineer
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          allow-bots: true
          prompt-file: game_factory/art_department/PRODUCTION_PROMPT.md
      - name: Independent mechanical animation and scope gates
        id: gate1
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p artifacts/art-department
          {
          python -m game_factory.art_department.pipeline gate
          if python -c "import json; j=json.load(open('game_factory/art_department/jobs/active.json')); exit(0 if j.get('atlas_layout')=='directional-grid' else 1)"; then
            python -m game_factory.cataclysm_asset_release --stage heroanimation --run-id "$GITHUB_RUN_ID"
          fi
          git diff --check
          python -m game_factory.art_department.run_checks unit
          } 2>&1 | tee artifacts/art-department/mechanical-gate-1.log
      - name: Write automatic mechanical rejection feedback for next isolated animator
        if: steps.gate1.outcome == 'failure'
        env:
          ART_REVIEW_ATTEMPT: '1'
        run: python game_factory/art_department/mechanical_failure.py
      - name: Launch a genuine web game, not a mockup
        if: steps.gate1.outcome == 'success'
        shell: bash
        run: |
          nohup python -m http.server 8765 --directory docs >/tmp/borhez-art-server.log 2>&1 &
          sleep 2
          target="$(python -c 'import json;print(json.load(open("game_factory/art_department/jobs/active.json"))["play_url_path"])')"
          curl --fail "http://127.0.0.1:8765/$target/" >/dev/null
      - name: Inspect running game, motion states and stress scene in Chrome
        if: steps.gate1.outcome == 'success'
        run: |
          node game_factory/art_department/browser-review.cjs
          python -m game_factory.art_department.run_checks browser
      - name: Independent art director — assess first candidate
        if: steps.gate1.outcome == 'success'
        id: review1
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ART_REVIEW_ATTEMPT: '1'
        run: python -m game_factory.art_department.pipeline review
      - name: Snapshot rejected source and independent visual evidence
        if: steps.review1.outcome == 'failure' || steps.gate1.outcome == 'failure'
        run: python game_factory/art_department/snapshot_candidate.py
      - name: Transfer rejected candidate to a fresh secured runner
        if: steps.review1.outcome == 'failure' || steps.gate1.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rejected-art-stage1
          path: artifacts/art-department/
          if-no-files-found: error
          retention-days: 10
      - name: Commit only independently accepted candidate
        if: steps.review1.outcome == 'success'
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash game_factory/art_department/commit_accepted.sh
      - name: Publish reproducible art, actual screenshots and critical review as run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art-department-acceptance-evidence
          path: artifacts/art-department/
          if-no-files-found: ignore
          retention-days: 30

  repair-one:
    needs: produce-and-review
    if: needs.produce-and-review.outputs.review_outcome == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: write
      pull-requests: write
      actions: read
    outputs:
      pr: ${{ steps.candidate.outputs.pr }}
      review_outcome: ${{ steps.gate2.outcome == 'failure' && 'failure' || steps.review2.outcome }}
    env:
      ART_JOB: game_factory/art_department/jobs/active.json
      BORHEZ_BROWSER_CHANNEL: chrome
    steps:
      - name: Fresh protected runner — resume rejected art source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install production and browser tools before revoking privileges
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow cairosvg
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          google-chrome --version
      - name: Restore prior candidate, visual QA and browser screenshots
        uses: actions/download-artifact@v4
        with:
          name: rejected-art-stage1
          path: artifacts/art-department/
      - name: Apply source-only candidate patch — do not smuggle unreviewed assets
        run: |
          test -s artifacts/art-department/candidate.patch
          test -s artifacts/art-department/revision-brief.md
          git apply --binary --check artifacts/art-department/candidate.patch
          git apply --binary artifacts/art-department/candidate.patch
          git diff --check
      - name: Autonomous character animator — actual rejected poses corrected
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          allow-bots: true
          prompt-file: game_factory/art_department/REVISION_PROMPT.md
      - name: Source, frame, silhouette and gameplay contracts
        id: gate2
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p artifacts/art-department
          {
          python -m game_factory.art_department.pipeline gate
          if python -c "import json; j=json.load(open('game_factory/art_department/jobs/active.json')); exit(0 if j.get('atlas_layout')=='directional-grid' else 1)"; then
            python -m game_factory.cataclysm_asset_release --stage heroanimation --run-id "$GITHUB_RUN_ID"
          fi
          git diff --check
          python -m game_factory.art_department.run_checks unit
          } 2>&1 | tee artifacts/art-department/mechanical-gate-2.log
      - name: Write automatic mechanical rejection feedback for next isolated animator
        if: steps.gate2.outcome == 'failure'
        env:
          ART_REVIEW_ATTEMPT: '2'
        run: python game_factory/art_department/mechanical_failure.py
      - name: Serve the actual Cataclysm game and stress lab
        if: steps.gate2.outcome == 'success'
        shell: bash
        run: |
          nohup python -m http.server 8765 --directory docs >/tmp/borhez-art-server.log 2>&1 &
          sleep 2
          target="$(python -c 'import json;print(json.load(open("game_factory/art_department/jobs/active.json"))["play_url_path"])')"
          curl --fail "http://127.0.0.1:8765/$target/" >/dev/null
      - name: Re-render all 24 real-browser run and attack frames
        if: steps.gate2.outcome == 'success'
        run: |
          node game_factory/art_department/browser-review.cjs
          python -m game_factory.art_department.run_checks browser
      - name: Independent visual art director — attempt two
        if: steps.gate2.outcome == 'success'
        id: review2
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ART_REVIEW_ATTEMPT: '2'
        run: python -m game_factory.art_department.pipeline review
      - name: Snapshot independently rejected corrected artwork
        if: steps.review2.outcome == 'failure' || steps.gate2.outcome == 'failure'
        run: python game_factory/art_department/snapshot_candidate.py
      - name: Transfer correction to final isolated runner
        if: steps.review2.outcome == 'failure' || steps.gate2.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rejected-art-stage2
          path: artifacts/art-department/
          if-no-files-found: error
          retention-days: 10
      - name: Commit only independently accepted character candidate
        if: steps.review2.outcome == 'success'
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash game_factory/art_department/commit_accepted.sh
      - name: Retain critic verdict, contact frames and actual mobile gameplay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art-department-review-review2
          path: artifacts/art-department/
          if-no-files-found: ignore
          retention-days: 30

  repair-two:
    needs: repair-one
    if: needs.repair-one.outputs.review_outcome == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: write
      pull-requests: write
      actions: read
    outputs:
      pr: ${{ steps.candidate.outputs.pr }}
      review_outcome: ${{ steps.review3.outcome }}
    env:
      ART_JOB: game_factory/art_department/jobs/active.json
      BORHEZ_BROWSER_CHANNEL: chrome
    steps:
      - name: Fresh protected runner — resume rejected art source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install production and browser tools before revoking privileges
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow cairosvg
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          google-chrome --version
      - name: Restore prior candidate, visual QA and browser screenshots
        uses: actions/download-artifact@v4
        with:
          name: rejected-art-stage2
          path: artifacts/art-department/
      - name: Apply source-only candidate patch — do not smuggle unreviewed assets
        run: |
          test -s artifacts/art-department/candidate.patch
          test -s artifacts/art-department/revision-brief.md
          git apply --binary --check artifacts/art-department/candidate.patch
          git apply --binary artifacts/art-department/candidate.patch
          git diff --check
      - name: Autonomous character animator — actual rejected poses corrected
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          allow-bots: true
          prompt-file: game_factory/art_department/REVISION_PROMPT.md
      - name: Source, frame, silhouette and gameplay contracts
        run: |
          python -m game_factory.art_department.pipeline gate
          if python -c "import json; j=json.load(open('game_factory/art_department/jobs/active.json')); exit(0 if j.get('atlas_layout')=='directional-grid' else 1)"; then
            python -m game_factory.cataclysm_asset_release --stage heroanimation --run-id "$GITHUB_RUN_ID"
          fi
          git diff --check
          python -m game_factory.art_department.run_checks unit
      - name: Serve the actual Cataclysm game and stress lab
        shell: bash
        run: |
          nohup python -m http.server 8765 --directory docs >/tmp/borhez-art-server.log 2>&1 &
          sleep 2
          target="$(python -c 'import json;print(json.load(open("game_factory/art_department/jobs/active.json"))["play_url_path"])')"
          curl --fail "http://127.0.0.1:8765/$target/" >/dev/null
      - name: Re-render all 24 real-browser run and attack frames
        run: |
          node game_factory/art_department/browser-review.cjs
          python -m game_factory.art_department.run_checks browser
      - name: Independent visual art director — attempt three
        id: review3
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ART_REVIEW_ATTEMPT: '3'
        run: python -m game_factory.art_department.pipeline review
      - name: Commit only independently accepted character candidate
        if: steps.review3.outcome == 'success'
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash game_factory/art_department/commit_accepted.sh
      - name: Retain critic verdict, contact frames and actual mobile gameplay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art-department-review-review3
          path: artifacts/art-department/
          if-no-files-found: ignore
          retention-days: 30

  publish-accepted-character:
    needs: [produce-and-review, repair-one, repair-two]
    if: ${{ always() && (needs.produce-and-review.outputs.pr != '' || needs.repair-one.outputs.pr != '' || needs.repair-two.outputs.pr != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: borhez-mobile-pages-delivery
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge exact gated artwork PR, not an unrelated candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.repair-two.outputs.pr || needs.repair-one.outputs.pr || needs.produce-and-review.outputs.pr }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PR_NUMBER"
          gh auth setup-git
          head="$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)"
          test "$head" = "studio/art-department-${{ github.run_id }}"
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          python -m game_factory.art_department.run_checks unit
      - name: Upload all playable games with newly accepted character
        uses: actions/upload-pages-artifact@v3
        with:
          name: bo-rhez-art-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs
      - name: Deploy accepted build
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: bo-rhez-art-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 180000
      - name: Retry identical Pages archive after competing deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - name: Retry Pages deployment
        id: retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: bo-rhez-art-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 180000
      - name: Verify live playable game and new frame atlases byte-for-byte
        env:
          PAGES_URL: ${{ steps.deploy.outputs.page_url || steps.retry.outputs.page_url }}
        run: |
          python - <<'PY'
          import hashlib,json,os,time,urllib.request
          from pathlib import Path
          j=json.loads(Path('game_factory/art_department/jobs/active.json').read_text())
          base=os.environ['PAGES_URL'].rstrip('/')+'/'
          paths=[j['source_dir'].removeprefix('docs/')+'/animation.js']
          if j.get('atlas_layout')=='directional-grid':
              for directory in (j['source_dir'],j['mirror_dir']):
                  basepath=directory.removeprefix('docs/')+'/'
                  paths += [basepath+'animation.js',basepath+'art/actor-packs.json',basepath+'index.html',basepath+'game.js']
                  paths += [basepath+'art/characters/'+j['character']+'/'+j['family']+'/'+state+'.png' for state in j['states']]
          else:
              paths += [j['source_dir'].removeprefix('docs/')+'/art/'+j['character']+'-'+state+'.png' for state in j['states']]
              paths += [j['mirror_dir'].removeprefix('docs/')+'/art/'+j['character']+'-'+state+'.png' for state in j['states']]
          paths += [j['play_url_path']+'/index.html']
          for item in paths:
              expected=hashlib.sha256((Path('docs')/item).read_bytes()).hexdigest()
              for attempt in range(12):
                  try:
                      u=base+item+'?run='+os.environ['GITHUB_RUN_ID']+'&attempt='+str(attempt)
                      with urllib.request.urlopen(urllib.request.Request(u,headers={'Cache-Control':'no-cache'}),timeout=20) as r:
                          assert hashlib.sha256(r.read()).hexdigest()==expected,'live bytes differ'
                      print('LIVE VERIFIED:',u)
                      break
                  except Exception:
                      if attempt==11:raise
                      time.sleep(5)
          PY
      - name: Publish verified playtest link to workflow summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          j=json.load(open('game_factory/art_department/jobs/active.json'))
          base='https://borhex.github.io/kbc-rpg-prototype/'
          print('Art Department ACCEPTED and LIVE: '+base+j['play_url_path']+'/')
          print('Mirror: '+base+j['mirror_dir'].removeprefix('docs/')+'/')
          PY
