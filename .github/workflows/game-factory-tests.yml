name: BoRHeZ Game Factory
on:
  push:
    branches: [feature/borhez-game-factory-v0]
  pull_request:
    branches: [main, feature/borhez-games-studio-v0]
  workflow_dispatch:
jobs:
  games:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check studio/web/game.js
      - run: node --check studio/web/app.js
      - run: python -m unittest game_factory.test_agent_memory game_factory.test_agent_api game_factory.test_development_council -v
      - run: python -m unittest discover -s game_factory/tests -v
      - run: python -m unittest discover -s studio/tests -v
      - run: python game_factory/council.py --out /tmp/borhez-factory-report.json
      - run: python -c "import json; x=json.load(open('/tmp/borhez-factory-report.json')); assert len(x['ballots'])==5"
      - uses: actions/upload-artifact@v4
        with:
          name: game-factory-evidence
          path: /tmp/borhez-factory-report.json
  mobile-browser:
    env:
      BORHEZ_BROWSER_CHANNEL: chrome
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          google-chrome --version
      - name: Test the stamped release over HTTP
        env:
          BUILD_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python -m game_factory.stamp_preview --run-id "$BUILD_RUN"
          python -m http.server 8765 --directory docs >/tmp/game-http.log 2>&1 &
          node game_factory/acceptance_gate.cjs
