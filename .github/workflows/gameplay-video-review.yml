name: Gameplay video to AI development report
on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: "Google Drive gameplay recording file ID"
        required: false
        default: "1GbMVr_GNoDA4mlpqX_zQBYWjUpO56Pam"\n      reprocess_existing:\n        description: "Reprocess a previously reviewed video (incurs AI costs)"\n        type: boolean\n        required: false\n        default: false
  schedule:
    - cron: "20 7 * * *"
permissions:
  contents: read
  issues: write
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install processing dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check openai requests
      - name: Download, transcribe, analyse, edit and report
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: "1ARwayk85TIK4MibwwXTsdAm4EKjQAh0K"
          DRIVE_FILE_ID: ${{ inputs.drive_file_id }}\n          REPROCESS_EXISTING: ${{ inputs.reprocess_existing }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python game_factory/video_pipeline.py
