name: Review gameplay and send feedback to Game Studio
on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: "Optional Drive file ID; leave blank to review newest video"
        required: false
        default: ""
  schedule:
    - cron: '20 6,18 * * *'
  push:
    branches: [main]
    paths: [game_factory/requests/video_review_trigger.json]
permissions:
  contents: write
  actions: read
concurrency:
  group: borhez-gameplay-video-reviews
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install processing dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check openai requests
      - name: Verify Studio bridge import before processing media
        run: python -m game_factory.video_bridge
      - name: Select explicit review or newest new Cataclysm Drive recording
        env:
          WORKFLOW_DRIVE_FILE_ID: ${{ inputs.drive_file_id || '' }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re
          file_id = os.getenv("WORKFLOW_DRIVE_FILE_ID", "").strip()
          if not file_id and os.getenv("GITHUB_EVENT_NAME") == "push":
              trigger = json.load(open("game_factory/requests/video_review_trigger.json"))
              file_id = str(trigger.get("expected_drive_file_id", "")).strip()
          if file_id and not re.fullmatch(r"[A-Za-z0-9_-]{20,100}", file_id):
              raise SystemExit("Invalid configured Drive file ID")
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              stream.write("DRIVE_FILE_ID=" + file_id + "\n")
          print("Drive review:", "explicit file selected" if file_id else "newest Cataclysm recording")
          PY
      - name: Download, transcribe, inspect sampled frames and report
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: "1ARwayk85TIK4MibwwXTsdAm4EKjQAh0K"
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python game_factory/video_pipeline.py
      - name: Convert review into validated studio request and dispatch it
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python -m game_factory.video_bridge
      # Public repo: never upload private transcripts, recordings or screenshots.
      - name: Document review privacy boundary
        if: always()
        run: |
          echo "### Gameplay review" >> "$GITHUB_STEP_SUMMARY"
          echo "Private recording, transcript and media are not uploaded as GitHub artifacts." >> "$GITHUB_STEP_SUMMARY"
          echo "Only a private Drive reference and gameplay-only routing request may be committed publicly." >> "$GITHUB_STEP_SUMMARY"
          echo "YouTube comments and channel data are not used as automatic instructions." >> "$GITHUB_STEP_SUMMARY"
