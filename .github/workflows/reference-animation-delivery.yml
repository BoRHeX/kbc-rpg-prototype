name: Deliver accepted reference character animations
on:
  workflow_run:
    workflows: ["BoRHeZ Reference-to-Animation Studio"]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write
concurrency:
  group: borhez-mobile-pages-delivery
  cancel-in-progress: false
jobs:
  publish-reference-character:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve exact source run candidate PR; reject unrelated edits
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh auth setup-git
          branch="studio/character-reference-${SOURCE_RUN}"
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$branch" --base main --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            echo "::error::Successful reference animator has no corresponding PR"
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          gh pr diff "$number" --repo "$GITHUB_REPOSITORY" --name-only > /tmp/animation-diff.txt
          python - <<'PY'
          import os,re
          from pathlib import Path
          files=Path('/tmp/animation-diff.txt').read_text().splitlines()
          if not files:raise SystemExit('Empty animation PR')
          pattern=re.compile(r'^docs/(cataclysm-1-0-major|cataclysm-100-lab)/art/characters/([a-z][a-z0-9-]+)/([a-z]+)[.]png
          for file in files:
              if file in ('docs/cataclysm-1-0-major/art/character-animations.json','docs/cataclysm-100-lab/art/character-animations.json'):continue
              m=pattern.fullmatch(file)
              if not m:raise SystemExit('Unapproved PR file: '+file)
              actors.add(m[2])
              if m[3]=='anchor': anchors.add(m[2])
              else: states.add(m[3])
          if len(actors)!=1 or not states:raise SystemExit('Animation PR contains no unique actor and state set')
          for dir in ('cataclysm-1-0-major','cataclysm-100-lab'):
              for state in states:
                  if f'docs/{dir}/art/characters/{next(iter(actors))}/{state}.png' not in files:
                      raise SystemExit('Missing mirrored animation state '+state)
          actor=next(iter(actors))
          if anchors:
              if anchors!={actor}:raise SystemExit('Painted reference anchor has wrong actor')
              for directory in ('cataclysm-1-0-major','cataclysm-100-lab'):
                  if f'docs/{directory}/art/characters/{actor}/anchor.png' not in files:
                      raise SystemExit('Missing mirrored painted texture anchor')
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('ART_ACTOR='+actor+'\n')
              out.write('ART_STATES='+','.join(sorted(states))+'\n')
          print('Approved exact actor:',actor,'states:',sorted(states))
          PY
      - name: Check actual candidate, no generated-modification privileges
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.candidate.outputs.number }}
        run: |
          set -euo pipefail
          gh pr checkout "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          python -m pip install --quiet --disable-pip-version-check pillow
          python -m unittest game_factory.reference_animator_tests -v
          node game_factory/cataclysm_next/tests/art-integration.cjs
          node game_factory/cataclysm_next/tests/major-systems.cjs
          node game_factory/cataclysm_next/tests/spawn-economy.cjs
          for file in docs/cataclysm-1-0-major/*.js docs/cataclysm-100-lab/*.js; do node --check "$file"; done
          git diff --check
      - name: Verify real gameplay with generated art in Chrome
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          nohup python -m http.server 8765 --directory docs >/tmp/character-art-release-http.log 2>&1 &
          node game_factory/cataclysm_next/tests/browser-reference-animation.cjs
          node game_factory/cataclysm_next/tests/browser-major.cjs
          node game_factory/cataclysm_next/tests/browser-horde.cjs
      - name: Merge only revalidated reference-derived assets
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.candidate.outputs.number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
          git checkout main
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/upload-pages-artifact@v3
        with:
          name: character-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs
      - name: Deploy identical accepted bytes to both Cataclysm modes
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: character-reference-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Compare public generated animation bytes with merged source
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          python - <<'PY'
          import hashlib,os,time,urllib.request
          from pathlib import Path
          base=os.environ['PAGE_URL'].rstrip('/')+'/'
          actor=os.environ['ART_ACTOR'];states=os.environ['ART_STATES'].split(',')
          for game in ('cataclysm-1-0-major','cataclysm-100-lab'):
              extra=['characters/'+actor+'/anchor.png'] if (Path('docs')/game/'art'/'characters'/actor/'anchor.png').is_file() else []
              for asset in ['character-animations.json']+extra+['characters/'+actor+'/'+s+'.png' for s in states]:
                  path=Path('docs')/game/'art'/asset
                  expected=hashlib.sha256(path.read_bytes()).hexdigest()
                  for n in range(12):
                      try:
                          url=base+game+'/art/'+asset+'?verify='+os.environ['GITHUB_RUN_ID']+'-'+str(n)
                          with urllib.request.urlopen(url,timeout=20) as stream:
                              got=hashlib.sha256(stream.read()).hexdigest()
                          if got!=expected:raise RuntimeError('Hash mismatch')
                          print('Verified LIVE',game,asset)
                          break
                      except Exception:
                          if n==11:raise
                          time.sleep(5)
          PY
      - name: Publish completed reference-character animation URLs
        run: |
          echo "Integrated character: ${ART_ACTOR} · ${ART_STATES}" >> "$GITHUB_STEP_SUMMARY"
          echo "Main game: https://borhex.github.io/kbc-rpg-prototype/cataclysm-1-0-major/" >> "$GITHUB_STEP_SUMMARY"
          echo "Night 99 lab: https://borhex.github.io/kbc-rpg-prototype/cataclysm-100-lab/" >> "$GITHUB_STEP_SUMMARY"
)
          states=set();actors=set();anchors=set()
          for file in files:
              if file in ('docs/cataclysm-1-0-major/art/character-animations.json','docs/cataclysm-100-lab/art/character-animations.json'):continue
              m=pattern.fullmatch(file)
              if not m:raise SystemExit('Unapproved PR file: '+file)
              actors.add(m[2]);states.add(m[3])
          if len(actors)!=1 or not states:raise SystemExit('Animation PR contains no unique actor and state set')
          for dir in ('cataclysm-1-0-major','cataclysm-100-lab'):
              for state in states:
                  if f'docs/{dir}/art/characters/{next(iter(actors))}/{state}.png' not in files:
                      raise SystemExit('Missing mirrored animation state '+state)
          actor=next(iter(actors))
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('ART_ACTOR='+actor+'\n')
              out.write('ART_STATES='+','.join(sorted(states))+'\n')
          print('Approved exact actor:',actor,'states:',sorted(states))
          PY
      - name: Check actual candidate, no generated-modification privileges
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.candidate.outputs.number }}
        run: |
          set -euo pipefail
          gh pr checkout "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          python -m pip install --quiet --disable-pip-version-check pillow
          python -m unittest game_factory.reference_animator_tests -v
          node game_factory/cataclysm_next/tests/art-integration.cjs
          node game_factory/cataclysm_next/tests/major-systems.cjs
          node game_factory/cataclysm_next/tests/spawn-economy.cjs
          for file in docs/cataclysm-1-0-major/*.js docs/cataclysm-100-lab/*.js; do node --check "$file"; done
          git diff --check
      - name: Verify real gameplay with generated art in Chrome
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          nohup python -m http.server 8765 --directory docs >/tmp/character-art-release-http.log 2>&1 &
          node game_factory/cataclysm_next/tests/browser-reference-animation.cjs
          node game_factory/cataclysm_next/tests/browser-major.cjs
          node game_factory/cataclysm_next/tests/browser-horde.cjs
      - name: Merge only revalidated reference-derived assets
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.candidate.outputs.number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
          git checkout main
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/upload-pages-artifact@v3
        with:
          name: character-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs
      - name: Deploy identical accepted bytes to both Cataclysm modes
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: character-reference-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Compare public generated animation bytes with merged source
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          python - <<'PY'
          import hashlib,os,time,urllib.request
          from pathlib import Path
          base=os.environ['PAGE_URL'].rstrip('/')+'/'
          actor=os.environ['ART_ACTOR'];states=os.environ['ART_STATES'].split(',')
          for game in ('cataclysm-1-0-major','cataclysm-100-lab'):
              for asset in ['character-animations.json']+['characters/'+actor+'/'+s+'.png' for s in states]:
                  path=Path('docs')/game/'art'/asset
                  expected=hashlib.sha256(path.read_bytes()).hexdigest()
                  for n in range(12):
                      try:
                          url=base+game+'/art/'+asset+'?verify='+os.environ['GITHUB_RUN_ID']+'-'+str(n)
                          with urllib.request.urlopen(url,timeout=20) as stream:
                              got=hashlib.sha256(stream.read()).hexdigest()
                          if got!=expected:raise RuntimeError('Hash mismatch')
                          print('Verified LIVE',game,asset)
                          break
                      except Exception:
                          if n==11:raise
                          time.sleep(5)
          PY
      - name: Publish completed reference-character animation URLs
        run: |
          echo "Integrated character: ${ART_ACTOR} · ${ART_STATES}" >> "$GITHUB_STEP_SUMMARY"
          echo "Main game: https://borhex.github.io/kbc-rpg-prototype/cataclysm-1-0-major/" >> "$GITHUB_STEP_SUMMARY"
          echo "Night 99 lab: https://borhex.github.io/kbc-rpg-prototype/cataclysm-100-lab/" >> "$GITHUB_STEP_SUMMARY"
