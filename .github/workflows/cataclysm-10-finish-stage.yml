name: Cataclysm 1.0 finishing stage
on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
      previous:
        required: true
        type: string
      art_cache_run:
        required: false
        type: number
        default: 0
permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      STAGE: ${{ inputs.stage }}
      PREVIOUS: ${{ inputs.previous }}
      BORHEZ_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install independent browser and canvas QA outside the Codex sandbox
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          google-chrome --version
      - name: Restore the previous completed stage, never an unrelated release
        if: inputs.previous != ''
        uses: actions/download-artifact@v4
        with:
          name: cataclysm-10-finish-${{ inputs.previous }}
          path: docs/
      - name: Validate exact source inventory and take per-stage immutable baseline
        run: |
          set -euo pipefail
          node --check docs/cataclysm-1-0-major/game.js
          node --check docs/cataclysm-100-lab/game.js
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          folders=[Path('docs/cataclysm-1-0-major'),Path('docs/cataclysm-100-lab')]
          files={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for root in folders for p in root.rglob('*') if p.is_file()}
          Path('/tmp/cataclysm-stage-before.json').write_text(json.dumps(files))
          print('Stage baseline:',len(files),'game files')
          PY
      - name: AI team implements its complete bounded stage from the executive order
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          allow-bots: true
          prompt-file: game_factory/requests/cataclysm_10_finish_${{ inputs.stage }}.md
      - name: Restore already painted character art from previous FAILED QA run
        if: inputs.stage == 'animation' && inputs.art_cache_run > 0
        uses: actions/download-artifact@v4
        with:
          repository: BoRHeX/kbc-rpg-prototype
          run-id: ${{ inputs.art_cache_run }}
          github-token: ${{ github.token }}
          name: cataclysm-10-evidence-animation
          path: artifacts/art-recovered
      - name: Recover ONLY completed and dimension-validated painted image frames
        if: inputs.stage == 'animation' && inputs.art_cache_run > 0
        run: |
          python - <<'PY'
          import shutil,struct
          from pathlib import Path
          # The prior run generated all 24 role frames, eight hero bearings and seven textures,
          # then a stale *test version literal* failed. Do not pay to paint them again.
          root=Path('artifacts/art-recovered')
          output=Path('artifacts/cataclysm-10-finish/art/rendered')
          expected=set()
          for role in ('shooter','healer','tank','brawler','sniper','engineer','trapper','bard'):
            for state in ('attack','special','hit'):
              expected.add(role+'-'+state+'.png')
          expected.add('hero-aim.png')
          expected.update('ground-'+str(i)+'.png' for i in range(4))
          expected.update(('prop-car.png','prop-dumpster.png','prop-building.png'))
          found={}
          for file in root.rglob('*.png'):
            if file.name not in expected:continue
            if file.name in found:continue
            try:
              data=file.read_bytes()
              if not data.startswith(bytes.fromhex('89504e470d0a1a0a')) or len(data)<32:
                raise ValueError('Not a PNG file')
              dims=struct.unpack('>II',data[16:24])
              animated=(file.name=='hero-aim.png' or any(
                file.name.startswith(role+'-') for role in
                ('shooter','healer','tank','brawler','sniper','engineer','trapper','bard')))
              want=(768,96) if animated else (
                (300,300) if file.name.startswith('ground-') else (288,288))
              if dims!=want:
                print('Skipping unexpected asset dimensions',file.name,dims,want)
                continue
            except Exception as error:
              print('Skipping corrupt cached PNG:',file.name,str(error)[:160])
              continue
            found[file.name]=file
          output.mkdir(parents=True,exist_ok=True)
          for name,file in found.items():shutil.copy2(file,output/name)
          print('Recovered',len(found),'of',len(expected),'trusted image-model PNGs:',sorted(found))
          if len(found)<28:raise SystemExit('Incomplete recovered artwork cache; refuse unnecessary expensive regeneration')
          PY
      - name: Animation-source preflight before making expensive image calls
        if: inputs.stage == 'animation'
        run: |
          set -euo pipefail
          for js in docs/cataclysm-1-0-major/*.js docs/cataclysm-100-lab/*.js; do node --check "$js"; done
          node game_factory/cataclysm_finish_score_contract.cjs
          node game_factory/cataclysm_next/tests/major-systems.cjs
          node game_factory/cataclysm_next/tests/spawn-economy.cjs
          node game_factory/cataclysm_next/tests/visuals-scroll.cjs
      - name: Trusted image studio paints REAL follower behavior states and coherent city textures
        if: inputs.stage == 'animation'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STUDIO_IMAGE_MODEL: gpt-image-2.6-flare
          STUDIO_ANCHOR_MODEL: gpt-image-2.6-sunburst
        run: |
          test -n "$OPENAI_API_KEY"
          python -m pip install --disable-pip-version-check --quiet openai pillow
          python -m py_compile game_factory/cataclysm_finish_art.py
          python -m game_factory.cataclysm_finish_art
      - name: Keep world textures, character sprites and all local game code on ONE browser cache revision
        run: |
          set -euo pipefail
          python -m py_compile game_factory/cataclysm_asset_release.py
          python -m game_factory.cataclysm_asset_release --stage "$STAGE" --run-id "$GITHUB_RUN_ID"
      - name: Reject empty stages, unauthorized edits and any protected character changes
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          old=json.loads(Path('/tmp/cataclysm-stage-before.json').read_text())
          roots=[Path('docs/cataclysm-1-0-major'),Path('docs/cataclysm-100-lab')]
          after={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for root in roots for p in root.rglob('*') if p.is_file()}
          modified={name for name in set(old)|set(after) if old.get(name)!=after.get(name)}
          if not modified:raise SystemExit('Empty stage: no playable changes')
          if not any(name.startswith('docs/cataclysm-1-0-major/') for name in modified):
            raise SystemExit('Stage changed no main game assets')
          if not any(name.startswith('docs/cataclysm-100-lab/') for name in modified):
            raise SystemExit('Stage failed to update Night 99 test parity')
          tracked=subprocess.check_output(['git','diff','--name-only','-z','HEAD']).decode().split('\0')
          untracked=subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z']).decode().split('\0')
          for name in filter(None,tracked+untracked):
            if name.startswith('artifacts/'):continue
            if not any(name.startswith(str(root)+'/') for root in roots):
              raise SystemExit('Agent touched unauthorized source: '+name)
          for name in old:
            if '/art/characters/hero/' in name and not name.endswith('/aim.png'):
              if after.get(name)!=old[name]:raise SystemExit('Approved hero art overwritten: '+name)
          print('PASS scoped stage',os.environ['STAGE'],len(modified),'changed game files')
          PY
          git diff --check
      - name: Verify gameplay, schedule, art, scoring and synchronized source copies
        run: |
          set -euo pipefail
          for file in docs/cataclysm-1-0-major/*.js docs/cataclysm-100-lab/*.js; do node --check "$file"; done
          node game_factory/cataclysm_next/tests/major-systems.cjs
          node game_factory/cataclysm_next/tests/spawn-economy.cjs
          node game_factory/cataclysm_next/tests/visuals-scroll.cjs
          node game_factory/cataclysm_next/tests/art-integration.cjs
          node game_factory/cataclysm_finish_score_contract.cjs
      - name: Start game server for browser tests outside AI sandbox
        run: nohup python -m http.server 8765 --directory docs >/tmp/cataclysm-10-finish-http.log 2>&1 &
      - name: Independently play all eight mobile and desktop viewports
        run: node game_factory/cataclysm_next/tests/browser-major.cjs
      - name: Traverse the fixed, unbounded map on both game modes in real Chrome
        run: node game_factory/cataclysm_next/tests/browser-infinite.cjs
      - name: Compare painted asset revision and actual animation frames in both games
        run: node game_factory/cataclysm_next/tests/browser-art.cjs
      - name: Prove expensive shooters and ghosts, early XP thresholds, animated sprites and translucent speech
        if: inputs.stage == 'tuning'
        run: node game_factory/cataclysm_next/tests/browser-tuning.cjs
      - name: Independently check cat speech, menu, cards and move-only controls
        if: inputs.stage == 'polishui'
        run: node game_factory/cataclysm_next/tests/browser-personality.cjs
      - name: Verify moving hero buff states, directional frames and expanded contextual cat language
        if: inputs.stage == 'alive'
        run: node game_factory/cataclysm_next/tests/browser-alive.cjs
      - name: Prove visibly different engineer turret skins in real browser
        if: inputs.stage == 'alive'
        run: node game_factory/cataclysm_next/tests/browser-turret-skins.cjs
      - name: Check one actual character texture source, no layered hero ghost and moving art in mobile Chrome
        if: inputs.stage == 'cleanpack'
        run: node game_factory/cataclysm_next/tests/browser-clean-character-pack.cjs
      - name: Enforce stage-specific motion, score and follower acceptance
        run: node game_factory/cataclysm_finish_acceptance.cjs "$STAGE"
      - name: Save exact source for next stage recovery
        uses: actions/upload-artifact@v4
        with:
          name: cataclysm-10-finish-${{ inputs.stage }}
          path: |
            docs/cataclysm-1-0-major/
            docs/cataclysm-100-lab/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve unaccepted game candidate source for targeted recovery, even if QA fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cataclysm-10-unaccepted-${{ inputs.stage }}-source
          path: |
            docs/cataclysm-1-0-major/
            docs/cataclysm-100-lab/
          if-no-files-found: error
          retention-days: 30
      - name: Save screenshots and model failures for art review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cataclysm-10-evidence-${{ inputs.stage }}
          path: |
            artifacts/cataclysm-major/
            artifacts/cataclysm-10-finish/
          if-no-files-found: ignore
          retention-days: 30
