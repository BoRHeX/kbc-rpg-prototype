name: Release pretested Cataclysm AI build
on:
  push:
    branches: [main]
    paths: ['game_factory/RELEASE_PRETESTED_TRIGGER.md']
permissions:
  actions: read
  contents: write
concurrency:
  group: cataclysm-pretested-artifact-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Download immutable artifact from browser-tested agent run
        uses: actions/download-artifact@v4
        with:
          name: cataclysm-accepted-preview
          run-id: '42010567811'
          github-token: ${{ github.token }}
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate original accepted code and stamp release evidence
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/preview/game.js
          python - <<'PY'
          import re
          from pathlib import Path
          run='42010567811'
          page=Path('docs/preview/index.html')
          html=page.read_text()
          html,count=re.subn(r'(<div\s+class="version"[^>]*>)[^<]*(</div>)',
              lambda m:m.group(1)+'AI PLAYTEST '+run+m.group(2),html,count=1)
          if count!=1: raise SystemExit('Required build label missing')
          html=html.replace(
              "document.getElementById('build-version').textContent = 'CODE BUILD · ' + build;",
              "document.getElementById('build-version').textContent = 'AI PLAYTEST "+run+" · CODE ' + build;")
          page.write_text(html)
          Path('docs/preview/BUILD_INFO.txt').write_text(
              'Run '+run+'\nOriginal independent browser QA: PASSED\n'
              'Repeated browser QA in failed publishing attempt: PASSED\n'
              'Real Samsung hardware verification: PENDING\n')
          Path('game_factory/QA_VERIFICATION.txt').write_text(
              'AI studio build '+run+'\n'
              'GitHub acceptance gate: PASS Samsung Android emulation; PASS Chrome Android emulation\n'
              'GitHub release re-test: PASS Samsung Android emulation; PASS Chrome Android emulation\n'
              'Physical Samsung hardware confirmation is not yet available.\n')
          for name in ['game_factory/AGENT_PLAN.md','game_factory/AGENT_QA.md','game_factory/CODER_REPORT.md']:
              p=Path(name)
              if p.exists(): p.write_text(p.read_text().rstrip()+'\n')
          PY
      - name: Commit browser-tested artifact (no paid AI invocation)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BoRHeZ Autonomous Studio'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/preview game_factory/AGENT_PLAN.md game_factory/AGENT_QA.md game_factory/CODER_REPORT.md game_factory/QA_VERIFICATION.txt
          git diff --cached --check
          git commit -m 'Publish accepted Cataclysm AI preview 42010567811'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo 'Playtest URL: https://borhex.github.io/kbc-rpg-prototype/preview/' >> "$GITHUB_STEP_SUMMARY"
