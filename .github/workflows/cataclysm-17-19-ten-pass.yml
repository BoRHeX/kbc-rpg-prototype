name: Cataclysm 1.7–1.9 — ONE 10-pass autonomous studio run
run-name: CATACLYSM · 10 passes · Long Night → Distilled Advancement → Polish & Gating
on:
  push:
    branches: [main]
    paths:
      - game_factory/requests/cataclysm-17-19-ten-pass-launch.md
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cataclysm-17-19-ten-pass
  cancel-in-progress: false
jobs:
  p01:
    name: Pass 01/10 · Cataclysm 1.7 · Long Night producer, campaign system architect, save-state designer
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore inherited product and verify studio scripts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile game_factory/cataclysm_17_19_studio.py
          node --check game_factory/cataclysm_17_19_browser.mjs
          python game_factory/cataclysm_17_19_studio.py setup 1.7
          mkdir -p artifacts/cataclysm-three
      - name: Build grounded department work order
        shell: bash
        run: |
          set -euo pipefail
          cat > artifacts/cataclysm-three/DEPARTMENT.md <<'BORHEZ_DEPARTMENT'
          # BoRHeZ Games Studio — ten-pass coordinated run; pass 01 of 10; version 1.7
          You are one independently invoked coding/creative studio role working on ONE continuous Cataclysm video game.
          Your exact task: This is Pass 01 of TEN, version 1.7 THE LONG NIGHT. Act as Producer + campaign/save architect. Inspect the actual inherited Cataclysm 1.69 game.js, campaign.js and company.js BEFORE designing. Deliver STUDIO/CONCEPT.md, STUDIO/SAVE_SCHEMA.json and STUDIO/PRODUCTION_PLAN.md with an implementable 1000-night, ten-distinct-chapter plan, timed 3-hour target, serialization/restore contract, RNG and version migration, phone background safety, side effects, boss state and exact acceptance fixtures. Implement a small modular foundation only if needed. No fake full campaign. Design Endless to unlock ONLY after Night1000. The previous Night100 completion logic must not end campaign early. Preserve city/mutants/fishing/festival and all other inherited systems. Your design is handed to an independent actual engineering pass. Real files only, no future-person promises.
          Do not ask the creator for small approvals; make source-grounded decisions and leave testable artifacts.
          Only modify files inside the CURRENT version directory (docs/cataclysm-1-7/). Never edit or erase previous versions.
          No fictional art or QA: only claim raster PNGs, WAVs, game mechanics and browser tests when actual files/source/evidence exists.
          Read the approved and creator-authorized ten-pass order, relevant roadmap and current real runtime first.
          Keep it playable when practical, but a broken experimental pass must still be preserved and reported.
          BORHEZ_DEPARTMENT
          {
            echo '## Owner-authorized whole run'
            cat game_factory/CATACLYSM_17_19_TEN_PASS_ORDER.md
            echo '## Original approved long roadmap'
            cat game_factory/CATACLYSM_1_1_TO_2_0_ROADMAP.md
            echo '## Studio candidate and failure-preservation policy'
            cat game_factory/STUDIO_MULTIPASS_PRODUCTION_POLICY.md
            echo '## Actual available original generated art'
            if test -f docs/cataclysm-1-7/STUDIO/IMAGE_MANIFEST.json; then cat docs/cataclysm-1-7/STUDIO/IMAGE_MANIFEST.json; fi
            echo '## Real preceding work / handoff'
            if test -f docs/cataclysm-1-7/STUDIO/PASS_LEDGER.json; then cat docs/cataclysm-1-7/STUDIO/PASS_LEDGER.json; fi
          } >> artifacts/cataclysm-three/DEPARTMENT.md
      - name: Independent AI studio specialist performs REAL source/art integration
        id: develop
        uses: openai/codex-action@v1
        continue-on-error: true
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          allow-bots: true
          prompt-file: artifacts/cataclysm-three/DEPARTMENT.md
      - name: Record real outcome without throwing away completed work
        if: ${{ always() }}
        run: |
          python game_factory/cataclysm_17_19_studio.py record 01 1.7 ${{ steps.develop.outcome }}
      - name: Archive entire active game and original media after this pass
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cataclysm-triple-p01-${{ github.run_id }}
          path: docs/cataclysm-1-7
          if-no-files-found: warn
          retention-days: 45
          include-hidden-files: true
