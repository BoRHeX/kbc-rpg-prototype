      pull-requests: write
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore all THREE final version source snapshots, not demos
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for spec in '1.7:04 03 02 01' '1.8:07 06 05' '1.9:10 09 08'; do
            version="${spec%%:*}"
            passes="${spec#*:}"
            target="docs/cataclysm-$version"
            mkdir -p "$target"
            found=no
            for id in $passes; do
              if gh run download "$GITHUB_RUN_ID" -n "cataclysm-triple-p$id-$GITHUB_RUN_ID" -D "$target" 2>/dev/null; then
                found=yes
                echo "Recovered $version from pass $id" >> "$GITHUB_STEP_SUMMARY"
                break
              fi
            done
            if [ "$found" = no ] || [ ! -s "$target/game.js" ]; then
              echo "::warning::No saved source for $version; preserving predecessor as unverified fallback"
              rm -rf "$target"
              python game_factory/cataclysm_17_19_studio.py setup "$version"
              mkdir -p "$target/STUDIO"
              printf 'Missing surviving artifact. Copied predecessor. Not an implemented %s release.\n' "$version" > "$target/STUDIO/PUBLISH_FALLBACK.txt"
            fi
          done
      - name: Independently label all three candidates from surviving files and QA
        run: |
          set -euo pipefail
          for version in 1.7 1.8 1.9; do
            python game_factory/cataclysm_17_19_studio.py candidate "$version"
          done
      - name: Archive all finished candidates before attempting to merge/publish
        uses: actions/upload-artifact@v4
        with:
          name: cataclysm-17-19-final-${{ github.run_id }}
          path: |
            docs/cataclysm-1-7
            docs/cataclysm-1-8
            docs/cataclysm-1-9
            docs/cataclysm-1-7-candidate
            docs/cataclysm-1-8-candidate
            docs/cataclysm-1-9-candidate
          retention-days: 60
          if-no-files-found: error
          include-hidden-files: true
      - name: Publish THREE immutable candidate versions in ONE PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BoRHeZ Games Studio'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          branch="studio/cataclysm-17-19-$GITHUB_RUN_ID"
          git switch -c "$branch"
          git add docs/cataclysm-1-7 docs/cataclysm-1-8 docs/cataclysm-1-9 docs/cataclysm-1-7-candidate docs/cataclysm-1-8-candidate docs/cataclysm-1-9-candidate
          git -c core.whitespace=-trailing-space diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Cataclysm 1.7–1.9: ten autonomous source passes and preserved honest candidate states'
          gh auth setup-git
          git push --set-upstream origin HEAD
          pr="$(gh pr create --base main --head "$branch" --title 'Cataclysm: 1.7 Long Night + 1.8 Distilled Advancement + 1.9 Polish & Gating' --body 'One owner-authorized 10-pass studio run, sequential cumulative version snapshots: 1.7 1000-night save/resume, 1.8 fusion/weather/side missions, 1.9 menu/codex/Threshold Trial. Actual image assets and every stage preserved; experimental status per version in STUDIO/CANDIDATE_STATUS.json. Does not claim complete physical Android testing or 2.0 readiness; old versions unchanged.")"
          echo "PR: $pr" >> "$GITHUB_STEP_SUMMARY"
          gh pr merge "$pr" --squash --delete-branch
          git checkout main
          git fetch origin main
          git reset --hard origin/main
          for v in 1.7 1.8 1.9; do test -s "docs/cataclysm-$v/STUDIO/CANDIDATE_STATUS.json"; done
      - name: Create Pages artifact with all historic Cataclysm releases
        uses: actions/upload-pages-artifact@v3
        with:
          name: cataclysm-triple-pages-${{ github.run_id }}
          path: docs
      - name: Publish three experimental candidates, keep past releases
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: cataclysm-triple-pages-${{ github.run_id }}
          timeout: 180000
      - name: Record public candidate paths without pretending 2.0 exists
        run: |
          echo '### ONE 10-PASS STUDIO RUN · THREE EXPERIMENTAL CANDIDATES' >> "$GITHUB_STEP_SUMMARY"
          for v in 1.7 1.8 1.9; do
            echo "Candidate $v: https://borhex.github.io/kbc-rpg-prototype/cataclysm-$v-candidate/" >> "$GITHUB_STEP_SUMMARY"
            echo "Actual source/game $v: https://borhex.github.io/kbc-rpg-prototype/cataclysm-$v/" >> "$GITHUB_STEP_SUMMARY"
          done
          echo 'Versions 1.0–1.69 untouched; no 2.0 automatically launched.' >> "$GITHUB_STEP_SUMMARY"
