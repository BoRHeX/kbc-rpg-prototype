name: BoRHeZ Reference-to-Animation Studio
run-name: Animate character from reference image
on:
  workflow_dispatch:
    inputs:
      actor:
        description: "Existing Cataclysm character ID, e.g. trapper or hero"
        required: true
        type: string
      states:
        description: "Comma-separated motion states (run,attack,special), up to 6"
        default: run
        required: true
        type: string
      drive_file_id:
        description: "Private Google Drive reference image ID (use this OR reference_path)"
        required: false
        type: string
      reference_path:
        description: "Repo reference image under game_factory/art_references/"
        required: false
        type: string
      notes:
        description: "Optional character identity and animation notes"
        required: false
        type: string
      max_generations:
        description: "Maximum animation GIF generation calls, 1–6; texture-first adds one painted anchor"
        required: false
        default: "3"
        type: string
      texture_first:
        description: "Paint a real raster visual anchor before animating (one additional image call)"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - game_factory/requests/reference_animation.json
permissions:
  contents: write
  pull-requests: write
  actions: read
concurrency:
  group: borhez-reference-animations
  cancel-in-progress: false
jobs:
  animate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install visual models and independent test dependencies
        run: |
          python -m pip install --quiet --disable-pip-version-check --upgrade openai pillow requests
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          google-chrome --version
      - name: Resolve explicitly authorized character and reference; reject unsafe inputs BEFORE API costs
        id: request
        env:
          INPUT_ACTOR: ${{ inputs.actor || '' }}
          INPUT_STATES: ${{ inputs.states || '' }}
          INPUT_DRIVE_FILE_ID: ${{ inputs.drive_file_id || '' }}
          INPUT_REFERENCE_PATH: ${{ inputs.reference_path || '' }}
          INPUT_NOTES: ${{ inputs.notes || '' }}
          INPUT_MAX_GENERATIONS: ${{ inputs.max_generations || '3' }}
          INPUT_TEXTURE_FIRST: ${{ inputs.texture_first || 'false' }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from game_factory.reference_animator import validate_job
          if os.environ.get('GITHUB_EVENT_NAME')=='push':
              job=json.loads(Path('game_factory/requests/reference_animation.json').read_text())
              if job.get('enabled') is not True:
                  with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('active=false\n')
                  raise SystemExit(0)
          else:
              job=dict(actor=os.environ['INPUT_ACTOR'],states=os.environ['INPUT_STATES'],
                       drive_file_id=os.environ['INPUT_DRIVE_FILE_ID'],
                       reference_path=os.environ['INPUT_REFERENCE_PATH'],
                       notes=os.environ['INPUT_NOTES'],
                       max_generations=os.environ['INPUT_MAX_GENERATIONS'],
                       texture_first=os.environ['INPUT_TEXTURE_FIRST'].lower()=='true')
          if len(str(job.get('notes','')))>700:
              raise SystemExit('Creator notes exceed 700 characters')
          states=validate_job(job['actor'],job.get('states','run'),
                     job.get('reference_path',''),job.get('drive_file_id',''))
          maximum=int(job.get('max_generations',3))
          if not 1<=maximum<=6 or len(states)>maximum:
              raise SystemExit('Image requests exceed user-approved maximum (1-6)')
          job['max_generations']=maximum
          job['texture_first']=job.get('texture_first') is True
          reuse=str(job.get('reuse_anchor_run_id','')).strip()
          retries=int(job.get('max_visual_retries',0))
          if reuse and (not reuse.isdecimal() or len(reuse)>16):
              raise SystemExit('Invalid anchored source run ID')
          if not 0<=retries<=2:
              raise SystemExit('Image critique corrective calls must be 0-2')
          if (reuse or retries) and not job['texture_first']:
              raise SystemExit('Anchor reuse/retries only permitted in painted texture-first mode')
          job['reuse_anchor_run_id']=reuse
          job['max_visual_retries']=retries
          if job['texture_first'] and job['actor'] != 'hero':
              raise SystemExit('This first texture-first release is scoped to Cataclysm hero only')
          if job['texture_first'] and len(states) != 6:
              raise SystemExit('LITE MOBILE 1.0 hero release requires all six animation states')
          out=Path('artifacts/character-animation');out.mkdir(parents=True,exist_ok=True)
          (out/'job.json').write_text(json.dumps(job,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as fd:
              fd.write('active=true\nactor='+job['actor']+'\nstates='+','.join(states)+'\n')
              fd.write('texture_first='+str(job['texture_first']).lower()+'\n')
              fd.write('anchor_source_run='+reuse+'\n')
              fd.write('max_visual_retries='+str(retries)+'\n')
          print('Validated reference animation request',job['actor'],states,maximum)
          PY
      - name: Offline pipeline tests and existing game contracts (no API charges)
        if: steps.request.outputs.active == 'true'
        run: |
          python -m unittest game_factory.reference_animator_tests -v
          node game_factory/cataclysm_next/tests/major-systems.cjs
          node game_factory/cataclysm_next/tests/spawn-economy.cjs
      - name: Restore previously reviewed painted anchor (avoid repainting unchanged identity)
        if: steps.request.outputs.anchor_source_run != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.request.outputs.anchor_source_run }}
          name: character-animation-visual-review
          github-token: ${{ github.token }}
          path: artifacts/prior-painted-art/
      - name: Copy ONLY previously accepted anchor and its critic verdict
        if: steps.request.outputs.anchor_source_run != ''
        run: |
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          root=Path('artifacts/prior-painted-art')
          active=Path('artifacts/character-animation')
          # Strictly isolate previous run artifacts. Never overwrite the NEW
          # job.json, source request, visual QA settings or retry budget.
          expected=('painted-hero-anchor.png','anchor-review.json')
          for name in expected:
              matches=list(root.rglob(name))
              if len(matches)!=1:raise SystemExit('Missing or ambiguous prior artifact '+name)
              shutil.copyfile(matches[0],active/name)
          job=json.loads((active/'job.json').read_text())
          assert job.get('reuse_anchor_run_id'), 'Active request was overwritten'
          assert job.get('max_visual_retries')==2, 'Visual correction budget lost'
          assert job.get('texture_first') is True, 'Texture-first setting lost'
          print('Approved painted anchor restored without altering active job:',
                job.get('request_id'))
          PY
      - name: Inspect reference pixels, animate requested poses with image model, then run independent vision review
        if: steps.request.outputs.active == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          ART_REFERENCE_FOLDER_ID: ${{ secrets.ART_REFERENCE_FOLDER_ID }}
          STUDIO_IMAGE_MODEL: gpt-image-2.6-flare
          STUDIO_ANCHOR_MODEL: gpt-image-2.6-sunburst
          STUDIO_VISION_MODEL: gpt-6.1-terra
        run: |
          test -n "$OPENAI_API_KEY"
          python - <<'PY'
          import json
          from game_factory.reference_animator import run
          job=json.load(open('artifacts/character-animation/job.json'))
          args=['--actor',job['actor'],'--states',job.get('states','run'),
                '--max-generations',str(job['max_generations']),
                '--notes',job.get('notes','')]
          if job.get('reference_path'):args+=['--reference',job['reference_path']]
          else:args+=['--drive-file-id',job['drive_file_id']]
          if job.get('texture_first'):args.append('--texture-first')
          if job.get('reuse_anchor_run_id'):args.append('--reuse-painted-anchor')
          if job.get('max_visual_retries'):
              args+=['--max-visual-retries',str(job['max_visual_retries'])]
          run(args)
          PY
      - name: Validate only the character's PNG atlases and two mirrored manifests were edited
        if: steps.request.outputs.active == 'true'
        env:
          ACTOR: ${{ steps.request.outputs.actor }}
          STATES: ${{ steps.request.outputs.states }}
          TEXTURE_FIRST: ${{ steps.request.outputs.texture_first }}
        run: |
          python - <<'PY'
          import os,subprocess
          from pathlib import Path
          actor=os.environ['ACTOR'];states=set(os.environ['STATES'].split(','))
          tracked=subprocess.check_output(['git','diff','--name-only','-z','HEAD']).decode().split('\0')
          extra=subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z']).decode().split('\0')
          changed={p for p in tracked+extra if p and not p.startswith('artifacts/')}
          expected={f'docs/{dir}/art/characters/{actor}/{state}.png' for dir in ('cataclysm-1-0-major','cataclysm-100-lab') for state in states}
          if os.getenv('TEXTURE_FIRST')=='true':
              expected|={f'docs/{dir}/art/characters/{actor}/anchor.png' for dir in ('cataclysm-1-0-major','cataclysm-100-lab')}
          manifests={f'docs/{dir}/art/character-animations.json' for dir in ('cataclysm-1-0-major','cataclysm-100-lab')}
          if not expected.issubset(changed) or not changed.issubset(expected|manifests):
              raise SystemExit('Unexpected or missing generated source files: '+repr(sorted(changed)))
          if not manifests.issubset(changed):raise SystemExit('Manifest not updated in both releases')
          print('Verified',len(changed),'exact art and manifest changes; no gameplay changes')
          PY
          git diff --check
      - name: Browser test verifies animation actually decodes, changes pose and renders in gameplay
        if: steps.request.outputs.active == 'true'
        env:
          ART_ACTOR: ${{ steps.request.outputs.actor }}
          ART_STATES: ${{ steps.request.outputs.states }}
        run: |
          nohup python -m http.server 8765 --directory docs >/tmp/borhez-visual-server.log 2>&1 &
          node game_factory/cataclysm_next/tests/browser-reference-animation.cjs
          node game_factory/cataclysm_next/tests/browser-major.cjs
          node game_factory/cataclysm_next/tests/browser-horde.cjs
      - name: Open reviewable production candidate; no unreviewed animation reaches main
        if: steps.request.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ART_ACTOR: ${{ steps.request.outputs.actor }}
          ART_STATES: ${{ steps.request.outputs.states }}
        run: |
          set -euo pipefail
          branch="studio/character-reference-${GITHUB_RUN_ID}"
          git config user.name "BoRHeZ Character Animator"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs/cataclysm-1-0-major/art/characters/ docs/cataclysm-1-0-major/art/character-animations.json
          git add docs/cataclysm-100-lab/art/characters/ docs/cataclysm-100-lab/art/character-animations.json
          git diff --cached --check
          git commit -m "Art Studio: reference-derived animations for ${ART_ACTOR}"
          gh auth setup-git
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Reference Animator: ${ART_ACTOR} · ${ART_STATES}" \
            --body "Generated from an authorized image reference using a vision identity brief and animated image edits. Each animation state is independently reviewed for motion and character consistency. Atlas dimensions, transparency and real-browser sprite decoding passed. Core gameplay, enemy balance and other games unchanged. This PR will be automatically rechecked before publishing."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-animation-visual-review
          path: |
            artifacts/character-animation/
            artifacts/cataclysm-major/
          if-no-files-found: ignore
          retention-days: 20
