name: Deliver Accepted Mobile Game
run-name: Deliver ${{ github.event.client_payload.request_id || inputs.request_id || 'accepted game' }} (${{ github.event.client_payload.delivery_key || 'recovery' }})
on:
  repository_dispatch:
    types: [borhez-mobile-delivery]
  push:
    branches: [main]
    paths: ['game_factory/DELIVERY_REQUEST.json']
  workflow_dispatch:
    inputs:
      request_id:
        description: Accepted job ID recorded in game_factory/results
        type: string
        required: true

concurrency:
  group: borhez-mobile-pages-delivery
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      # This workflow starts after the accepted commit exists. Its GITHUB_SHA
      # therefore identifies the source actually being deployed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact accepted game source and independent QA evidence
        id: accepted
        env:
          REQUEST_ID: ${{ github.event.client_payload.request_id || inputs.request_id || '' }}
        run: python -m game_factory.mobile_jobs verify_published
      - name: Cancel an explicitly marked obsolete deployment during recovery
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          obsolete="$(python - <<'PYCANCEL'
          import json,re,os
          from pathlib import Path
          value=json.loads(Path('game_factory/DELIVERY_REQUEST.json').read_text()).get('cancel_deployment','')
          if value and (not re.fullmatch(r'[0-9a-f]{40}',value) or value==os.environ['GITHUB_SHA']):
              raise SystemExit('Refusing invalid/current deployment cancellation')
          print(value)
          PYCANCEL
          )"
          if [ -n "$obsolete" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/deployments/$obsolete/cancel" --silent || echo "::warning::Obsolete deployment cancellation was not accepted; successful deployment and live verification are still required"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          name: mobile-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs
      - name: Deploy the accepted source commit
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: mobile-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 180000
      - name: Allow a competing Pages deployment to finish before one retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - name: Retry delivery once using the same accepted artifact
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4
        with:
          artifact_name: mobile-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 180000
      - name: Verify exact live game bytes
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
        run: python game_factory/verify_live.py artifacts/mobile/delivery-receipt.json "$PAGES_URL"
      - name: Verify Games dashboard is reachable with exact published bytes
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
        run: |
          python - <<'PYDASH'
          import hashlib, os, time, urllib.request
          from pathlib import Path
          expected = hashlib.sha256(Path('docs/games/index.html').read_bytes()).hexdigest()
          base = os.environ['PAGES_URL'].rstrip('/') + '/games/'
          for attempt in range(12):
              url = base + '?verify=' + os.environ['GITHUB_SHA'] + '&attempt=' + str(attempt)
              try:
                  request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(request, timeout=15) as response:
                      observed = hashlib.sha256(response.read()).hexdigest()
                  if observed != expected:
                      raise RuntimeError('Dashboard bytes do not match delivered source')
                  print('Dashboard live and exact bytes verified:', base)
                  break
              except Exception as error:
                  if attempt == 11:
                      raise SystemExit('Game deployed but dashboard NOT verified: ' + str(error))
                  time.sleep(5)
          PYDASH
      - name: Record delivery evidence and the stable play link
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
          PLAY_PATH: ${{ steps.accepted.outputs.play_path }}
          REQUEST_ID: ${{ steps.accepted.outputs.request_id }}
        run: |
          echo "### Live delivery verified: $REQUEST_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Play: ${PAGES_URL%/}/$PLAY_PATH" >> "$GITHUB_STEP_SUMMARY"
          echo "Accepted source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
