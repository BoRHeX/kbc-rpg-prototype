name: Autonomous Cataclysm Game Studio
on:
  push:
    branches: [main]
    paths:
      - 'game_factory/STUDIO_TRIGGER.md'
  schedule:
    - cron: '15 7,19 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: read
  actions: read
concurrency:
  group: autonomous-game-studio
  cancel-in-progress: false
jobs:
  iterate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect tester feedback
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue list --state all --limit 40 --json number,title,body,labels --jq '.[] | select((.labels | map(.name) | index("gameplay-feedback")) != null) | "Issue #\(.number): \(.title)\n\(.body)\n"' > game_factory/RECENT_TESTER_ISSUES.md
          cat game_factory/RECENT_TESTER_ISSUES.md >> game_factory/TESTER_FEEDBACK.md
      - name: Validate baseline
        run: |
          node --check studio/web/game.js
          python -m unittest discover -s game_factory/tests -v
          python -m unittest discover -s studio/tests -v
      - name: Restore Council memory
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p artifacts
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=autonomous-council-memory&per_page=50" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')" || run=""
          if [ -n "$run" ]; then gh run download "$run" --name autonomous-council-memory --dir artifacts || true; fi
      - name: Seven-agent development cycle
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COUNCIL_MODEL: gpt-4.1-mini
        run: |
          test -n "$OPENAI_API_KEY"
          python -m game_factory.autonomous_studio
      - name: Preserve agent memory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-council-memory
          path: artifacts/autonomous.sqlite3
          if-no-files-found: ignore
          retention-days: 90
      - name: Build isolated playable preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/preview
          cp docs/v03/index.html docs/preview/index.html
          cp docs/v03/game.css docs/preview/game.css
          cp docs/v03/game-config.json docs/preview/game-config.json
          cp studio/web/game.js docs/preview/game.js
          sed -i "s|fetch('/game-config.json')|fetch('./game-config.json')|g" docs/preview/game.js
          sed -i 's/ALPHA 0.3/AUTONOMOUS PREVIEW/g' docs/preview/index.html
          node --check docs/preview/game.js
          printf 'Run %s\n' "$GITHUB_RUN_ID" > docs/preview/BUILD_INFO.txt
      - name: Browser smoke test for mobile input\n        run: |\n          npm install --no-save playwright@1.56.1\n          npx playwright install chromium\n          node game_factory/browser_smoke.cjs\n      - name: Publish verified source and preview
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BoRHeZ Autonomous Studio'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add studio/web/game.js game_factory/AUTONOMOUS_REPORT.md docs/preview
          git diff --cached --check
          git commit -m "AI Studio: tested autonomous game iteration #$GITHUB_RUN_ID"
          git push origin HEAD:main
          echo "Playable preview: https://borhex.github.io/kbc-rpg-prototype/preview/" >> "$GITHUB_STEP_SUMMARY"
