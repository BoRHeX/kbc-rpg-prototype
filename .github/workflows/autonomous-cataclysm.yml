name: Autonomous Cataclysm Game Studio
on:
  schedule:
    - cron: '15 7,19 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: read
concurrency:
  group: autonomous-game-studio
  cancel-in-progress: false
jobs:
  iterate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect tester feedback and avoid overlapping candidate work
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          count="$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("ai/autonomous-"))] | length')"
          if [ "$count" -gt 0 ]; then
            echo 'Unreviewed candidate exists; skip paid development to prevent runaway costs'
            echo 'SKIP_CYCLE=true' >> "$GITHUB_ENV"
            exit 0
          fi
          gh issue list --state all --limit 20 --json number,title,body,labels --jq '.[] | select((.labels | map(.name) | index("gameplay-feedback")) != null) | "Issue #\(.number): \(.title)\n\(.body)\n"' > game_factory/TESTER_FEEDBACK.md
      - name: Baseline tests
        if: env.SKIP_CYCLE != 'true'
        run: |
          node --check studio/web/game.js
          python -m unittest discover -s game_factory/tests -v
          python -m unittest discover -s studio/tests -v
      - name: Restore persistent Council memory
        if: env.SKIP_CYCLE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p artifacts
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=autonomous-council-memory&per_page=50" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')" || run=""
          if [ -n "$run" ]; then gh run download "$run" --name autonomous-council-memory --dir artifacts || true; fi
      - name: Run seven real AI roles with bounded API calls
        if: env.SKIP_CYCLE != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COUNCIL_MODEL: gpt-4.1-mini
        run: |
          test -n "$OPENAI_API_KEY"
          python -m game_factory.autonomous_studio
      - name: Preserve agent decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-council-memory
          path: artifacts/autonomous.sqlite3
          if-no-files-found: ignore
          retention-days: 90
      - name: Create reviewable candidate
        if: success() && env.SKIP_CYCLE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="ai/autonomous-$GITHUB_RUN_ID"
          git config user.name 'BoRHeZ Autonomous Studio'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add studio/web/game.js game_factory/AUTONOMOUS_REPORT.md
          git diff --cached --check
          git commit -m "AI Studio: autonomous tested game iteration"
          git push origin "$branch"
          gh pr create --draft --base main --head "$branch" --title "Autonomous Cataclysm iteration #$GITHUB_RUN_ID" --body-file game_factory/AUTONOMOUS_REPORT.md || echo "::warning::Candidate branch saved but automatic PR creation blocked"
