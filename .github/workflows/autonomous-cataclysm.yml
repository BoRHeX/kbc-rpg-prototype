name: Autonomous Cataclysm Game Studio
on:
  push:
    branches: [main]
    paths: ['game_factory/STUDIO_TRIGGER.md']
  workflow_dispatch:
concurrency:
  group: cataclysm-game-studio
  cancel-in-progress: false

jobs:
  develop:
    env:
      BORHEZ_BROWSER_CHANNEL: chrome
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install independent browser QA tools BEFORE AI is given access
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          google-chrome --version
      - name: Read open tester bugs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue list --state open --limit 40 --json number,title,body,labels --jq '.[] | select((.labels | map(.name) | index("gameplay-feedback")) != null) | "Issue #\(.number): \(.title)\n\(.body)\n"' > game_factory/RECENT_TESTER_ISSUES.md
          cat game_factory/TESTER_FEEDBACK.md >> game_factory/RECENT_TESTER_ISSUES.md
      - name: Validate original source before spending API credits
        run: |
          node --check docs/preview/game.js
          python -m unittest discover -s game_factory/tests -v
          python -m unittest discover -s studio/tests -v
      - name: Restore Council memory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          prior="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=autonomous-council-memory&per_page=30" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')" || prior=""
          if [ -n "$prior" ]; then gh run download "$prior" --name autonomous-council-memory --dir artifacts || true; fi
      - name: Five AI agents design and challenge the next task
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COUNCIL_MODEL: gpt-4.1-mini
        run: |
          test -n "$OPENAI_API_KEY"
          python -m game_factory.plan_cycle
      - name: Start real static preview server for coding agent
        run: |
          nohup python -m http.server 8765 --directory docs >/tmp/cataclysm-http.log 2>&1 &
          sleep 2
      - name: AI Coder edits files and executes local tools
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          allow-bots: true
          prompt-file: game_factory/CODEX_GAME_STUDIO_PROMPT.md
      - name: First independent browser acceptance
        id: first_gate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/preview/game.js 2>&1 | tee game_factory/QA_RESULTS.txt
          CATACLYSM_TEST_URL=http://127.0.0.1:8765/preview/ node game_factory/acceptance_gate.cjs 2>&1 | tee -a game_factory/QA_RESULTS.txt
      - name: AI Coder repairs reported browser failures (maximum one extra call)
        if: steps.first_gate.outcome == 'failure'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          allow-bots: true
          prompt: |
            You are the Cataclysm Coder repairing the first independent QA failure.
            Read game_factory/QA_RESULTS.txt, game_factory/AGENT_PLAN.md,
            game_factory/RECENT_TESTER_ISSUES.md and docs/preview game files.
            Fix the actual defect using your file editing and shell tools.
            Allowed edits: docs/preview/index.html, game.js, game.css,
            game-config.json, game_factory/browser_smoke.cjs and
            game_factory/CODER_REPORT.md only. Do not touch QA acceptance_gate.cjs,
            workflows, secrets or any code that authorizes publishing.
            Tests will rerun independently, so do not change them.
            Document correction and remaining limitations in Coder report.
      - name: Reject unauthorized modifications from coding agent
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          for file in $changed; do
            case "$file" in
              docs/preview/index.html|docs/preview/game.js|docs/preview/game.css|docs/preview/game-config.json|game_factory/browser_smoke.cjs|game_factory/CODER_REPORT.md) ;;
              *) echo "::error::Unauthorized AI edit: $file"; exit 1 ;;
            esac
          done
          if git diff --quiet -- docs/preview; then
            echo "::error::No actual playable game modification produced"
            exit 1
          fi
      - name: Stamp candidate BEFORE its final browser acceptance
        env:
          BUILD_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: python -m game_factory.stamp_preview --run-id "$BUILD_RUN" --source-sha "$SOURCE_SHA"
      - name: Final independent functional QA (mandatory)
        shell: bash
        run: |
          set -euo pipefail
          : > game_factory/QA_RESULTS.txt
          node --check docs/preview/game.js 2>&1 | tee -a game_factory/QA_RESULTS.txt
          python -m unittest discover -s game_factory/tests -v 2>&1 | tee -a game_factory/QA_RESULTS.txt
          python -m unittest discover -s studio/tests -v 2>&1 | tee -a game_factory/QA_RESULTS.txt
          CATACLYSM_TEST_URL=http://127.0.0.1:8765/preview/ node game_factory/acceptance_gate.cjs 2>&1 | tee -a game_factory/QA_RESULTS.txt
      - name: Independent AI QA and producer handoff
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COUNCIL_MODEL: gpt-4.1-mini
        run: python -m game_factory.qa_cycle
      - name: Upload accepted playable candidate
        uses: actions/upload-artifact@v4
        with:
          name: cataclysm-accepted-preview
          path: |
            docs/preview/
            game_factory/AGENT_PLAN.md
            game_factory/AGENT_QA.md
            game_factory/CODER_REPORT.md
          if-no-files-found: error
          retention-days: 14
      - name: Save Council memory and all QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-council-memory
          path: artifacts/autonomous.sqlite3
          if-no-files-found: ignore
          retention-days: 90
      - name: Save failed cycle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-cycle-diagnostics
          path: |
            game_factory/AGENT_PLAN.md
            game_factory/CODER_REPORT.md
            game_factory/QA_RESULTS.txt
          if-no-files-found: ignore
          retention-days: 30

  publish:
    needs: develop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cataclysm-accepted-preview
          path: .
      - name: Publish accepted game (no AI key in publisher)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BoRHeZ AI Game Studio'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/preview game_factory/AGENT_PLAN.md game_factory/AGENT_QA.md game_factory/CODER_REPORT.md
          # Normalize every generated line, including real newline termination.
          python - <<'PY'
          from pathlib import Path
          for name in ('game_factory/AGENT_PLAN.md','game_factory/AGENT_QA.md','game_factory/CODER_REPORT.md'):
              path=Path(name)
              if path.exists(): path.write_text('\n'.join(line.rstrip() for line in path.read_text().splitlines())+'\n')
          PY
          git add game_factory/AGENT_PLAN.md game_factory/AGENT_QA.md game_factory/CODER_REPORT.md
          git diff --cached --check
          git commit -m "AI Game Studio: browser-tested playable candidate #$GITHUB_RUN_ID"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "Preview: https://borhex.github.io/kbc-rpg-prototype/preview/" >> "$GITHUB_STEP_SUMMARY"
          echo "Human Samsung browser verification remains required" >> "$GITHUB_STEP_SUMMARY"
      # A push made with GITHUB_TOKEN does not trigger another workflow/Pages build.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy the accepted commit to Pages
        id: deployment
        uses: actions/deploy-pages@v4
