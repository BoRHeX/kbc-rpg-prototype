name: Cataclysm 1.4 — THE UNSEEN CITY five-pass autonomous studio
run-name: 1.4 · Five production passes · illustrated city and honest candidate
on:
  push:
    branches: [main]
    paths:
      - game_factory/requests/cataclysm-1-4-multipass-launch.md
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cataclysm-14-five-pass-candidate
  cancel-in-progress: false
jobs:
  concept:
    name: Pass 01 · Concept and visual specifications
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate multipass Python and Chrome tool syntax
        run: |
          python -m py_compile game_factory/studio_multipass_14.py
          node --check game_factory/cataclysm_14_browser.mjs
      - name: Ensure continuous baseline and stage directories
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/cataclysm-1-3/game.js
          test -s game_factory/CATACLYSM_14_MULTIPASS_ORDER.md
          mkdir -p artifacts/cataclysm-14
          if [ ! -s docs/cataclysm-1-4/game.js ]; then
            rm -rf docs/cataclysm-1-4
            cp -a docs/cataclysm-1-3 docs/cataclysm-1-4
            rm -f docs/cataclysm-1-4/STUDIO-REPORT.md docs/cataclysm-1-4/PRODUCTION-PLAN.md docs/cataclysm-1-4/SOURCE-TRACE.json
          fi
          mkdir -p docs/cataclysm-1-4/STUDIO
      - name: Assemble department-scoped instructions and persistent evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'YOU ARE THE CONCEPT, ART DIRECTION AND GAME DESIGN DEPARTMENT FOR CATACLYSM 1.4.'
            echo 'Inspect true 1.3 game source, current roadmap and actual approved scope. Your main deliverables are STUDIO/CONCEPT.md and STUDIO/ASSET_PLAN.json, scene/area map, district guardians, asset inventory, navigation math and style references.'
            echo 'No cartoon box substitutes masquerading as hand-painted assets. Concept must enable the direct original image generation next pass.'
            echo 'Plan realistic 1.4 seeded districts, 1.3-compatible squad/fish/Mecha. Asset specifications distinguish actual existing PNGs from assets that need new illustration.'
            echo 'Modify only docs/cataclysm-1-4/. Do not build 1.4 runtime before the image pass unless a small necessary integration design contract. Document actual content and risks.'
            echo '## OWNER-APPROVED 1.4 SCOPE and original illustrated-art contract'
            cat game_factory/CATACLYSM_14_MULTIPASS_ORDER.md
            echo '## STANDING STUDIO MULTI-PASS POLICY'
            cat game_factory/STUDIO_MULTIPASS_PRODUCTION_POLICY.md
            echo '## Actual predecessor implementation evidence'
            cat docs/cataclysm-1-3/STUDIO-REPORT.md
            echo '## Prior pass traces and asset records'
            if test -f docs/cataclysm-1-4/STUDIO/PASS_LEDGER.json; then cat docs/cataclysm-1-4/STUDIO/PASS_LEDGER.json; fi
            if test -f docs/cataclysm-1-4/STUDIO/IMAGE_MANIFEST.json; then cat docs/cataclysm-1-4/STUDIO/IMAGE_MANIFEST.json; fi
            if test -f docs/cataclysm-1-4/STUDIO/BROWSER_QA.json; then cat docs/cataclysm-1-4/STUDIO/BROWSER_QA.json; fi
          } > artifacts/cataclysm-14/DEPARTMENT_BRIEF.md
      - name: Genuine independent AI department implementation
        id: worker
        uses: openai/codex-action@v1
        continue-on-error: true
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          allow-bots: true
          prompt-file: artifacts/cataclysm-14/DEPARTMENT_BRIEF.md
      - name: Record real department outcome (failure does NOT discard work)
        if: ${{ always() }}
        run: python game_factory/studio_multipass_14.py record 01 ${{ steps.worker.outcome }}
      - name: Preserve entire versioned worktree and pass evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cataclysm-14-pass01-${{ github.run_id }}
          path: docs/cataclysm-1-4
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true
  art:
    name: Pass 02 · Actual image-generated raster PNGs
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    needs: concept
    if: ${{ always() && !cancelled() }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore actual preceding pass source
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: cataclysm-14-pass01-${{ github.run_id }}
          path: docs/cataclysm-1-4
      - name: Ensure continuous baseline and stage directories
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/cataclysm-1-3/game.js
          test -s game_factory/CATACLYSM_14_MULTIPASS_ORDER.md
          mkdir -p artifacts/cataclysm-14
          if [ ! -s docs/cataclysm-1-4/game.js ]; then
            rm -rf docs/cataclysm-1-4
            cp -a docs/cataclysm-1-3 docs/cataclysm-1-4
            rm -f docs/cataclysm-1-4/STUDIO-REPORT.md docs/cataclysm-1-4/PRODUCTION-PLAN.md docs/cataclysm-1-4/SOURCE-TRACE.json
          fi
          mkdir -p docs/cataclysm-1-4/STUDIO
      - name: Install real image processing dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Generate up to three REAL original raster PNG atlas files
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BORHEZ_IMAGE_MODEL: 'gpt-image-2.5-flare'
        run: python game_factory/studio_multipass_14.py art
      - name: Preserve image API provenance
        run: |
          test -s docs/cataclysm-1-4/STUDIO/IMAGE_MANIFEST.json
          python -c "import json; x=json.load(open('docs/cataclysm-1-4/STUDIO/IMAGE_MANIFEST.json')); print('ART STATUS:',x.get('status'))"
      - name: Preserve entire versioned worktree and pass evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cataclysm-14-pass02-${{ github.run_id }}
          path: docs/cataclysm-1-4
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true
  animation:
    name: Pass 03 · Sprites animation and original sound
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    needs: art
    if: ${{ always() && !cancelled() }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore actual preceding pass source
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: cataclysm-14-pass02-${{ github.run_id }}
          path: docs/cataclysm-1-4
      - name: Ensure continuous baseline and stage directories
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/cataclysm-1-3/game.js
          test -s game_factory/CATACLYSM_14_MULTIPASS_ORDER.md
          mkdir -p artifacts/cataclysm-14
          if [ ! -s docs/cataclysm-1-4/game.js ]; then
            rm -rf docs/cataclysm-1-4
            cp -a docs/cataclysm-1-3 docs/cataclysm-1-4
            rm -f docs/cataclysm-1-4/STUDIO-REPORT.md docs/cataclysm-1-4/PRODUCTION-PLAN.md docs/cataclysm-1-4/SOURCE-TRACE.json
          fi
          mkdir -p docs/cataclysm-1-4/STUDIO
      - name: Assemble department-scoped instructions and persistent evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'YOU ARE THE ANIMATION, ASSET PREPARATION AND COMPOSER DEPARTMENT. First inspect STUDIO/IMAGE_MANIFEST.json and the actual existing original PNGs inside art/generated.'
            echo 'Take real illustrated source atlases; crop/rig/assemble frames and proper transparent sprite references under art/animated/, with JS-readable frame manifest and human-inspectable animation example. Do NOT pretend static generated atlases are animated without real frames.'
            echo 'Produce original useful audio/music cue assets under audio/generated (real playable files, or truthful event scripts), build machine-readable frame/audio indices and STUDIO/ANIMATION_AUDIO_REPORT.md.'
            echo 'If image generator returned ART-BLOCKED, continue with honestly reported asset limitations and preserve prior 1.3 illustration; do not generate code-drawn character/environment assets as an alleged art completion.'
            echo 'Use only docs/cataclysm-1-4. Provide direct file/paths and source provenance, style matching and reasonable mobile asset budgets.'
            echo '## OWNER-APPROVED 1.4 SCOPE and original illustrated-art contract'
            cat game_factory/CATACLYSM_14_MULTIPASS_ORDER.md
            echo '## STANDING STUDIO MULTI-PASS POLICY'
            cat game_factory/STUDIO_MULTIPASS_PRODUCTION_POLICY.md
            echo '## Actual predecessor implementation evidence'
            cat docs/cataclysm-1-3/STUDIO-REPORT.md
            echo '## Prior pass traces and asset records'
            if test -f docs/cataclysm-1-4/STUDIO/PASS_LEDGER.json; then cat docs/cataclysm-1-4/STUDIO/PASS_LEDGER.json; fi
            if test -f docs/cataclysm-1-4/STUDIO/IMAGE_MANIFEST.json; then cat docs/cataclysm-1-4/STUDIO/IMAGE_MANIFEST.json; fi
            if test -f docs/cataclysm-1-4/STUDIO/BROWSER_QA.json; then cat docs/cataclysm-1-4/STUDIO/BROWSER_QA.json; fi
          } > artifacts/cataclysm-14/DEPARTMENT_BRIEF.md
      - name: Genuine independent AI department implementation
        id: worker
        uses: openai/codex-action@v1
        continue-on-error: true
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          allow-bots: true
          prompt-file: artifacts/cataclysm-14/DEPARTMENT_BRIEF.md
      - name: Record real department outcome (failure does NOT discard work)
        if: ${{ always() }}
        run: python game_factory/studio_multipass_14.py record 03 ${{ steps.worker.outcome }}
      - name: Preserve entire versioned worktree and pass evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cataclysm-14-pass03-${{ github.run_id }}
          path: docs/cataclysm-1-4
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true
  integration:
    name: Pass 04 · Illustrated seeded-city game integration
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    needs: animation
    if: ${{ always() && !cancelled() }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore actual preceding pass source
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: cataclysm-14-pass03-${{ github.run_id }}
          path: docs/cataclysm-1-4
      - name: Ensure continuous baseline and stage directories
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/cataclysm-1-3/game.js
          test -s game_factory/CATACLYSM_14_MULTIPASS_ORDER.md
          mkdir -p artifacts/cataclysm-14
          if [ ! -s docs/cataclysm-1-4/game.js ]; then
            rm -rf docs/cataclysm-1-4
            cp -a docs/cataclysm-1-3 docs/cataclysm-1-4
            rm -f docs/cataclysm-1-4/STUDIO-REPORT.md docs/cataclysm-1-4/PRODUCTION-PLAN.md docs/cataclysm-1-4/SOURCE-TRACE.json
          fi
          mkdir -p docs/cataclysm-1-4/STUDIO
      - name: Assemble department-scoped instructions and persistent evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'YOU ARE THE GAMEPLAY, CITY WORLD, SYSTEMS AND ART INTEGRATION DEPARTMENT FOR ACTUAL CATACLYSM 1.4.'
            echo 'You must change real running JS to add substantive seeded city districts, reachable offscreen magnet/rage/beacon arrow, menu-only world map, DPS check gates and unique area guardians, boss provocation and rare nonfarmable life reward.'
            echo 'Integrate STUDIO/IMAGE_MANIFEST real generated art when present by loading exact PNG image paths into canvas or sprites. Use original city atlas and guardian art instead of code-drawn geometry for primary new city objects. If ART-BLOCKED, keep explicitly labeled inherited visuals rather than lying about generated art.'
            echo 'Preserve actual 1.3 systems: companions, fish economy, Mecha, nine lives, cat tail gun, solo movement-only combat, sound and card upgrades. Add gameplay rather than only writing docs.'
            echo 'Ship any incomplete game source with honest STUDIO/INTEGRATION_REPORT.md. Version boot text must indicate 1.4. Only modify docs/cataclysm-1-4 and do not touch prior versions.'
            echo '## OWNER-APPROVED 1.4 SCOPE and original illustrated-art contract'
            cat game_factory/CATACLYSM_14_MULTIPASS_ORDER.md
            echo '## STANDING STUDIO MULTI-PASS POLICY'
            cat game_factory/STUDIO_MULTIPASS_PRODUCTION_POLICY.md
            echo '## Actual predecessor implementation evidence'
            cat docs/cataclysm-1-3/STUDIO-REPORT.md
            echo '## Prior pass traces and asset records'
            if test -f docs/cataclysm-1-4/STUDIO/PASS_LEDGER.json; then cat docs/cataclysm-1-4/STUDIO/PASS_LEDGER.json; fi
            if test -f docs/cataclysm-1-4/STUDIO/IMAGE_MANIFEST.json; then cat docs/cataclysm-1-4/STUDIO/IMAGE_MANIFEST.json; fi
            if test -f docs/cataclysm-1-4/STUDIO/BROWSER_QA.json; then cat docs/cataclysm-1-4/STUDIO/BROWSER_QA.json; fi
          } > artifacts/cataclysm-14/DEPARTMENT_BRIEF.md
      - name: Genuine independent AI department implementation
        id: worker
        uses: openai/codex-action@v1
        continue-on-error: true
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          allow-bots: true
          prompt-file: artifacts/cataclysm-14/DEPARTMENT_BRIEF.md
      - name: Record real department outcome (failure does NOT discard work)
        if: ${{ always() }}
        run: python game_factory/studio_multipass_14.py record 04 ${{ steps.worker.outcome }}
      - name: Preserve entire versioned worktree and pass evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cataclysm-14-pass04-${{ github.run_id }}
          path: docs/cataclysm-1-4
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true
  qa:
    name: Pass 05 · Polish and independent browser QA
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    needs: integration
    if: ${{ always() && !cancelled() }}
    permissions:
      contents: read
    outputs:
      more: ${{ steps.decide.outputs.more }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore actual preceding pass source
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: cataclysm-14-pass04-${{ github.run_id }}
          path: docs/cataclysm-1-4
      - name: Ensure continuous baseline and stage directories
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/cataclysm-1-3/game.js
          test -s game_factory/CATACLYSM_14_MULTIPASS_ORDER.md
          mkdir -p artifacts/cataclysm-14
          if [ ! -s docs/cataclysm-1-4/game.js ]; then
            rm -rf docs/cataclysm-1-4
            cp -a docs/cataclysm-1-3 docs/cataclysm-1-4
            rm -f docs/cataclysm-1-4/STUDIO-REPORT.md docs/cataclysm-1-4/PRODUCTION-PLAN.md docs/cataclysm-1-4/SOURCE-TRACE.json
          fi
          mkdir -p docs/cataclysm-1-4/STUDIO
      - name: Install real browser playtesting tools
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          google-chrome --version
      - name: Assemble department-scoped instructions and persistent evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'YOU ARE THE POST-INTEGRATION POLISH AND INDEPENDENT QA DEPARTMENT. Inspect the actual previous 1.4 game and its art, sprites, mechanics, reports and candidate status. Make source fixes/polish that change gameplay/visuals rather than administrative paperwork.'
            echo 'Prove and report where possible: starting/game canvas, phone portrait/landscape, 1.3 Mecha and 16 companions, seeded city, map outside gameplay, arrow, DPS gates, boss, original art references, audio and restart. Endgame difficulty remains a concern; consider prior 1.3 flawless nine-life completion.'
            echo 'Produce STUDIO/FINAL_REPORT.md with implemented/partial/broken features, missing illustrated assets, all tests run or blocked, honest Chrome/Samsung distinction, 1.5 handoff and any justified further work.'
            echo 'May request extra passes by writing STUDIO/EXTRA_PASS_REQUEST.json {request:true,reason:"...",target:"art|mechanics|audio|performance"}. Do not automatically ask when all core functionality boots and constraints satisfied.'
            echo 'You are not a release blocker: preserve source even if unplayable. Do not fake a pass. Modify only docs/cataclysm-1-4.'
            echo '## OWNER-APPROVED 1.4 SCOPE and original illustrated-art contract'
            cat game_factory/CATACLYSM_14_MULTIPASS_ORDER.md
            echo '## STANDING STUDIO MULTI-PASS POLICY'
            cat game_factory/STUDIO_MULTIPASS_PRODUCTION_POLICY.md
            echo '## Actual predecessor implementation evidence'
            cat docs/cataclysm-1-3/STUDIO-REPORT.md
            echo '## Prior pass traces and asset records'
            if test -f docs/cataclysm-1-4/STUDIO/PASS_LEDGER.json; then cat docs/cataclysm-1-4/STUDIO/PASS_LEDGER.json; fi
            if test -f docs/cataclysm-1-4/STUDIO/IMAGE_MANIFEST.json; then cat docs/cataclysm-1-4/STUDIO/IMAGE_MANIFEST.json; fi
            if test -f docs/cataclysm-1-4/STUDIO/BROWSER_QA.json; then cat docs/cataclysm-1-4/STUDIO/BROWSER_QA.json; fi
          } > artifacts/cataclysm-14/DEPARTMENT_BRIEF.md
      - name: Genuine independent AI department implementation
        id: worker
        uses: openai/codex-action@v1
        continue-on-error: true
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          allow-bots: true
          prompt-file: artifacts/cataclysm-14/DEPARTMENT_BRIEF.md
      - name: Record real department outcome (failure does NOT discard work)
        if: ${{ always() }}
        run: python game_factory/studio_multipass_14.py record 05 ${{ steps.worker.outcome }}
      - name: Start actual candidate for mobile browser evidence
        run: nohup python -m http.server 8765 --directory docs > /tmp/cataclysm-14-http.log 2>&1 &
      - name: Test actual Chrome boot and nonblank canvas without blocking candidate
        continue-on-error: true
        run: node game_factory/cataclysm_14_browser.mjs
      - name: Choose whether a justified additional pass is necessary
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          more="$(python game_factory/studio_multipass_14.py extra 05 | python -c 'import sys,json;print(str(json.load(sys.stdin)["needs_extra"]).lower())')"
          echo "more=$more" >> "$GITHUB_OUTPUT"
          echo "Optional next-pass request: $more" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve entire versioned worktree and pass evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cataclysm-14-pass05-${{ github.run_id }}
          path: docs/cataclysm-1-4
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true
  repair06:
    name: Pass 06 · Autonomous extra pass 1
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    needs: qa
    if: ${{ always() && needs.qa.outputs.more == 'true' }}
    permissions:
      contents: read
    outputs:
      more: ${{ steps.decide.outputs.more }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore actual preceding pass source
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: cataclysm-14-pass05-${{ github.run_id }}
          path: docs/cataclysm-1-4
      - name: Ensure continuous baseline and stage directories
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/cataclysm-1-3/game.js
          test -s game_factory/CATACLYSM_14_MULTIPASS_ORDER.md
          mkdir -p artifacts/cataclysm-14
          if [ ! -s docs/cataclysm-1-4/game.js ]; then
            rm -rf docs/cataclysm-1-4
            cp -a docs/cataclysm-1-3 docs/cataclysm-1-4
            rm -f docs/cataclysm-1-4/STUDIO-REPORT.md docs/cataclysm-1-4/PRODUCTION-PLAN.md docs/cataclysm-1-4/SOURCE-TRACE.json
          fi
          mkdir -p docs/cataclysm-1-4/STUDIO
      - name: Install real browser playtesting tools
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          google-chrome --version
      - name: Assemble department-scoped instructions and persistent evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'YOU ARE AUTONOMOUS REPAIR DEPARTMENT 1, triggered by actual failed Chrome smoke or STUDIO/EXTRA_PASS_REQUEST.json. Read all earlier reports, error logs and user-approved 1.4 scope; fix the highest-impact actual broken part of game art/animation/integration.'
            echo 'Do not rewrite from 1.3 or erase actual output. Keep original artwork; respect title/one-game continuity and movement-only controls. Do not waste pass on paperwork alone.'
            echo 'Update STUDIO/FINAL_REPORT.md and make a new EXTRA_PASS_REQUEST.json only if another specific repair is justified, otherwise {request:false}.'
            echo '## OWNER-APPROVED 1.4 SCOPE and original illustrated-art contract'
            cat game_factory/CATACLYSM_14_MULTIPASS_ORDER.md
            echo '## STANDING STUDIO MULTI-PASS POLICY'
            cat game_factory/STUDIO_MULTIPASS_PRODUCTION_POLICY.md
            echo '## Actual predecessor implementation evidence'
            cat docs/cataclysm-1-3/STUDIO-REPORT.md
            echo '## Prior pass traces and asset records'
            if test -f docs/cataclysm-1-4/STUDIO/PASS_LEDGER.json; then cat docs/cataclysm-1-4/STUDIO/PASS_LEDGER.json; fi
            if test -f docs/cataclysm-1-4/STUDIO/IMAGE_MANIFEST.json; then cat docs/cataclysm-1-4/STUDIO/IMAGE_MANIFEST.json; fi
            if test -f docs/cataclysm-1-4/STUDIO/BROWSER_QA.json; then cat docs/cataclysm-1-4/STUDIO/BROWSER_QA.json; fi
          } > artifacts/cataclysm-14/DEPARTMENT_BRIEF.md
      - name: Genuine independent AI department implementation
        id: worker
        uses: openai/codex-action@v1
        continue-on-error: true
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          allow-bots: true
          prompt-file: artifacts/cataclysm-14/DEPARTMENT_BRIEF.md
      - name: Record real department outcome (failure does NOT discard work)
        if: ${{ always() }}
        run: python game_factory/studio_multipass_14.py record 06 ${{ steps.worker.outcome }}
